name: KYVORIQ Build 155 responsive visual preflight
on:
  push:
    branches: ['prep/build155-music-island']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-and-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Verify source privacy, security controls and widget binding
        run: |
          set -euo pipefail
          UI=dev-trader/android/app/src/main/java/com/devtrader/app/SafeActivity.kt
          WIDGET=dev-trader/android/app/src/main/java/com/devtrader/app/KyvoriqWidgetProvider.kt
          ! grep -Fq 'dewald_levels_2026_10_12' "$UI"
          ! grep -Fq 'fallbackLine("NPOC"' "$UI"
          grep -Fq 'consumeWidgetDestination()' "$UI"
          grep -Fq 'setOnClickPendingIntent(R.id.widget_alerts' "$WIDGET"
          grep -Fq 'ServiceUiState.AUTH_REQUIRED' dev-trader/android/app/src/main/java/com/devtrader/app/SignalService.kt
          grep -Fq 'entryChecksFullText' "$UI"
          grep -Fq 'musicIsland?.toggleIsland()' "$UI"
          grep -Fq 'registerForActivityResult(ActivityResultContracts.OpenDocument())' "$UI"
          grep -Fq 'AudioFocusRequest.Builder' dev-trader/android/app/src/main/java/com/devtrader/app/KyvoriqMusicIsland.kt
          ! grep -Fq 'READ_EXTERNAL_STORAGE' dev-trader/android/app/src/main/AndroidManifest.xml
          ! grep -Fq 'SYSTEM_ALERT_WINDOW' dev-trader/android/app/src/main/AndroidManifest.xml
      - name: Compile Build 155 debug candidate and UI instrumentation
        working-directory: dev-trader/android
        run: gradle assembleDebug assembleDebugAndroidTest -PdevTraderVersionCode=154 -PdevTraderVersionName=0.21.30 --stacktrace
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test small and normal Android viewports
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          script: |
            set -e
            mkdir -p ui-check
            adb install -r dev-trader/android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r dev-trader/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell wm size 720x1280
            adb shell wm density 320
            adb shell am instrument -e class com.devtrader.app.BrandVisualTest,com.devtrader.app.KyvoriqResponsiveLayoutTest,com.devtrader.app.MusicIslandVisualTest -w com.devtrader.app.debug.test/androidx.test.runner.AndroidJUnitRunner > ui-check/compact.txt
            grep -q 'OK (' ui-check/compact.txt
            adb pull /sdcard/Android/data/com.devtrader.app.debug/files/build154 ui-check/compact-motion
            adb pull /sdcard/Android/data/com.devtrader.app.debug/files/build155 ui-check/compact-island
            adb shell wm size 1080x2400
            adb shell wm density 420
            adb shell am instrument -e class com.devtrader.app.BrandVisualTest,com.devtrader.app.KyvoriqResponsiveLayoutTest,com.devtrader.app.MusicIslandVisualTest -w com.devtrader.app.debug.test/androidx.test.runner.AndroidJUnitRunner > ui-check/normal.txt
            grep -q 'OK (' ui-check/normal.txt
            adb pull /sdcard/Android/data/com.devtrader.app.debug/files/build154 ui-check/normal-motion
            adb pull /sdcard/Android/data/com.devtrader.app.debug/files/build155 ui-check/normal-island
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build155-visual-evidence
          path: |
            ui-check/
            dev-trader/android/app/build/outputs/apk/debug/
          retention-days: 14
