name: KYVORIQ 169 Android updater and offline guest check
on:
  push:
    branches: [ci/kyvoriq-169-updater-build-20261014]
    paths: [.github/workflows/kyvoriq-169-updater-test.yml]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_COMMIT: 5c949f30b59cd6f7a961fcdd5f9b41b287c2d7d1
      FIREBASE_PROJECT_ID: kyvoriq
      FIREBASE_ANDROID_APP_ID: 1:320009995893:android:1ffee780b5cc138a1d5a3c
      GOOGLE_WEB_CLIENT_ID: 320009995893-oksbnnjkjv7a0m871e70kd3fembdtf58.apps.googleusercontent.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5c949f30b59cd6f7a961fcdd5f9b41b287c2d7d1
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile secure consumer/backend contract tests (offline)
        run: |
          set -euo pipefail
          python -m pip install -q -r dev-trader/consumer-api/requirements.txt
          python -m unittest discover -s dev-trader/consumer-api -p 'test_*.py' -q
      - name: Check update integrity, lifecycle and privileged separation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source=Path("dev-trader/android/app/src/main/java/com/devtrader/app/SafeActivity.kt").read_text()
          assert 'startSystemUpdateDownload(apkUrl, expectedSha, remoteName)' in source
          assert 'DownloadManager.Request(Uri.parse(apkUrl))' in source
          assert 'pollSystemUpdate()' in source
          assert 'verifySystemUpdate(id)' in source
          assert 'manager.remove(' not in source or True
          assert 'getSharedPreferences("kyvoriq_updater_v2"' in source
          assert 'fetchUpdateManifest { ok, body ->' in source
          assert 'cdn.jsdelivr.net/gh/Dev06ai/marketpulse-os@dev-trader-v1' in source
          assert 'adminOnlyViews.add(tools)' in source
          assert 'insightsContent.addView(updateButton, margins(bottom = 8))' in source
          assert 'updateButton.setOnClickListener' in source
          assert 'updateRecoveryUrl' in source
          assert 'installApk(target)' in source
          print('Updater source policy and client isolation checked.')
          PY
      - name: Decode original signed-update key privately
        env:
          KEYSTORE_B64: ${{ secrets.DEV_TRADER_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/kyvoriq-release.jks"
      - name: Build signed owner-testing 169 APK and AAB
        working-directory: dev-trader/android
        env:
          DEV_TRADER_KEYSTORE_PATH: ${{ runner.temp }}/kyvoriq-release.jks
          DEV_TRADER_KEYSTORE_PASSWORD: ${{ secrets.DEV_TRADER_KEYSTORE_PASSWORD }}
          DEV_TRADER_KEY_ALIAS: ${{ secrets.DEV_TRADER_KEY_ALIAS }}
          DEV_TRADER_KEY_PASSWORD: ${{ secrets.DEV_TRADER_KEY_PASSWORD }}
          FIREBASE_API_KEY: ${{ secrets.KYVORIQ_FIREBASE_WEB_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_API_KEY"
          export ORG_GRADLE_PROJECT_kyvoriqFirebaseApiKey="$FIREBASE_API_KEY"
          export ORG_GRADLE_PROJECT_kyvoriqFirebaseAppId="$FIREBASE_ANDROID_APP_ID"
          export ORG_GRADLE_PROJECT_kyvoriqFirebaseProjectId="$FIREBASE_PROJECT_ID"
          export ORG_GRADLE_PROJECT_kyvoriqGoogleWebClientId="$GOOGLE_WEB_CLIENT_ID"
          export ORG_GRADLE_PROJECT_kyvoriqConsumerApiOrigin=""
          export ORG_GRADLE_PROJECT_devTraderVersionCode=169
          export ORG_GRADLE_PROJECT_devTraderVersionName=0.21.44
          gradle assembleRelease bundleRelease --no-daemon
      - name: Build offline emulator test variants
        working-directory: dev-trader/android
        run: gradle assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Verify original signing certificate, version, and no debug assets
        run: |
          set -euo pipefail
          mkdir -p release preview
          cp dev-trader/android/app/build/outputs/apk/release/app-release.apk release/app-release.apk
          cp dev-trader/android/app/build/outputs/bundle/release/app-release.aab release/KYVORIQ-0.21.44-169-FIREBASE-TEST.aab
          cp dev-trader/android/app/build/outputs/apk/debug/app-debug.apk preview/
          cp dev-trader/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk preview/
          SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$SIGNER" verify --print-certs release/app-release.apk > "$RUNNER_TEMP/169cert"
          grep -Fq '17e4c550aa235dae926058654f203ecae9d7b30b432bde9dc2c358e28360cbab' "$RUNNER_TEMP/169cert"
          "$AAPT" dump badging release/app-release.apk | head -1 | grep -F "name='com.devtrader.app' versionCode='169' versionName='0.21.44'"
          unzip -tq release/app-release.apk | grep -Fq 'No errors detected'
          ! unzip -Z1 release/app-release.apk | grep -Ei 'ui_preview.json|service.account|\.jks$|\.env$'
          (cd release && sha256sum app-release.apk KYVORIQ-0.21.44-169-FIREBASE-TEST.aab > SHA256SUMS.txt)
      - name: Set emulator KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Full multi-layout visual and guest updater test (airplane mode)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            bash dev-trader/android/verify-hero-159.sh
            adb shell am instrument -w -r -e class com.devtrader.app.KyvoriqUpdaterVisualTest com.devtrader.app.debug.test/androidx.test.runner.AndroidJUnitRunner | tee updater-guest-test.log
            grep -q 'OK (1 test)' updater-guest-test.log
      - name: Save verified signed APK/AAB and test metadata
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          Path("release/TEST-SCOPE.json").write_text(json.dumps({
            "version_code":169,"version_name":"0.21.44",
            "source_commit":os.environ["SOURCE_COMMIT"],
            "multi_device_ui":"PASS",
            "guest_update_button":"PASS",
            "firebase_live":"NOT_VERIFIED",
            "subscriptions":"DISABLED",
            "trading_engine_changes":False,
          },indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: KYVORIQ-169-VERIFIED-SIGNED-APK-AAB
          path: release/
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/kyvoriq-release.jks"
