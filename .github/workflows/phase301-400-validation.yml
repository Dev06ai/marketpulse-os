name: Phase 301-400 Adaptive Intelligence Validation
on:
  push:
    branches: ["phase301-400-adaptive-intelligence"]
  pull_request:
    branches: ["main"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: node --check phase301-400-adaptive-intelligence.js
      - run: node phase301-400-selftest.js
      - run: npm test
