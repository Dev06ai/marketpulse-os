name: NOVA assemble signed release

on:
  push:
    branches: [nova-standalone]
    paths:
      - 'public/updates/rebuild-0.3.1.trigger'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nova-standalone
          fetch-depth: 0
      - name: Reconstruct and verify signed APK
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib
          version='0.3.1'
          count=14
          expected='3f3a26d9a8f8a1305e8c32d306970ed56e94e561b87c6751484c258a0dd6462a'
          root=pathlib.Path(f'public/updates/apk_gz_parts/{version}')
          parts=[root/f'part{i:02d}.b64' for i in range(count)]
          missing=[str(p) for p in parts if not p.exists()]
          if missing:
              raise SystemExit('missing chunks: '+', '.join(missing))
          encoded=''.join(''.join(p.read_text().split()) for p in parts)
          apk=gzip.decompress(base64.b64decode(encoded))
          actual=hashlib.sha256(apk).hexdigest()
          if actual != expected:
              raise SystemExit(f'SHA-256 mismatch: {actual}')
          out=pathlib.Path(f'public/updates/NOVA-{version}.apk')
          out.write_bytes(apk)
          print(f'Wrote {out} ({len(apk)} bytes), SHA-256 {actual}')
          PY
          unzip -t public/updates/NOVA-0.3.1.apk >/dev/null
      - name: Publish reconstructed signed APK
        shell: bash
        run: |
          git config user.name 'NOVA Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/updates/NOVA-0.3.1.apk
          if git diff --cached --quiet; then
            echo 'Signed APK already published.'
            exit 0
          fi
          git commit -m 'NOVA: publish verified 0.3.1 signed APK'
          git push origin HEAD:nova-standalone
