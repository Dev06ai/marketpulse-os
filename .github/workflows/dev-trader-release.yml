name: KYVORIQ Release

on:
  push:
    branches:
      - "dev-trader-release-*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DEV_TRADER_KEYSTORE_BASE64: ${{ secrets.DEV_TRADER_KEYSTORE_BASE64 }}
      DEV_TRADER_KEYSTORE_PASSWORD: ${{ secrets.DEV_TRADER_KEYSTORE_PASSWORD }}
      DEV_TRADER_KEY_ALIAS: ${{ secrets.DEV_TRADER_KEY_ALIAS }}
      DEV_TRADER_KEY_PASSWORD: ${{ secrets.DEV_TRADER_KEY_PASSWORD }}
      DEV_TRADER_KEYSTORE_PATH: ${{ github.workspace }}/dev-trader-release.keystore
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backend preflight
        working-directory: dev-trader/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          python -m compileall app
          pytest -q test_analytics.py test_strategy.py
      - name: Verify private API regression before shipping
        run: |
          python -m compileall -q dev-trader/backend/app
          python dev-trader/backend/test_api_security.py
          python dev-trader/tools/security_scan.py --history
      - name: Verify signing configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEV_TRADER_KEYSTORE_BASE64" || { echo "Missing DEV_TRADER_KEYSTORE_BASE64"; exit 1; }
          test -n "$DEV_TRADER_KEYSTORE_PASSWORD" || { echo "Missing DEV_TRADER_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$DEV_TRADER_KEY_ALIAS" || { echo "Missing DEV_TRADER_KEY_ALIAS"; exit 1; }
          test -n "$DEV_TRADER_KEY_PASSWORD" || { echo "Missing DEV_TRADER_KEY_PASSWORD"; exit 1; }
          echo "$DEV_TRADER_KEYSTORE_BASE64" | base64 --decode > "$DEV_TRADER_KEYSTORE_PATH"
          test -s "$DEV_TRADER_KEYSTORE_PATH"

      - name: Parse release version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          REF="$GITHUB_REF_NAME"
          if [[ "$REF" =~ ^dev-trader-v([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+)$ ]]; then
            VERSION_NAME="${BASH_REMATCH[1]}"
            VERSION_CODE="${BASH_REMATCH[2]}"
            RELEASE_TAG="$REF"
          elif [[ "$REF" =~ ^dev-trader-release-([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+)$ ]]; then
            VERSION_NAME="${BASH_REMATCH[1]}"
            VERSION_CODE="${BASH_REMATCH[2]}"
            RELEASE_TAG="dev-trader-v${VERSION_NAME}-${VERSION_CODE}"
          else
            echo "Unsupported release ref: $REF"
            exit 1
          fi
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
      - name: Build signed release APK
        working-directory: dev-trader/android
        run: |
          gradle assembleRelease \
            -PdevTraderVersionName="${{ steps.meta.outputs.version_name }}" \
            -PdevTraderVersionCode="${{ steps.meta.outputs.version_code }}" \
            --stacktrace

      - name: Prepare release metadata
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.release_tag }}"
          VERSION_NAME="${{ steps.meta.outputs.version_name }}"
          VERSION_CODE="${{ steps.meta.outputs.version_code }}"
          APK="dev-trader/android/app/build/outputs/apk/release/app-release.apk"
          SHA256="$(sha256sum "$APK" | cut -d " " -f1)"
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/app-release.apk"
          cat > dev-trader-update.json <<EOF
          {
            "enabled": true,
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "apkUrl": "${APK_URL}",
            "sha256": "${SHA256}",
            "notes": "Signed KYVORIQ release ${VERSION_NAME}"
          }
          EOF
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Create release tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.release_tag }}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists."
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f "ref=refs/tags/${TAG}" -f "sha=${GITHUB_SHA}" >/dev/null
            echo "Created tag ${TAG} at ${GITHUB_SHA}."
          fi

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.release_tag }}"
          APK="dev-trader/android/app/build/outputs/apk/release/app-release.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release upload "$TAG" "dev-trader-update.json#dev-trader-update.json" --clobber
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              "$APK" \
              "dev-trader-update.json#dev-trader-update.json" \
              --title "KYVORIQ ${{ steps.meta.outputs.version_name }}" \
              --notes "Signed self-update release for KYVORIQ."
          fi

      - name: Publish update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          CONTENT="$(base64 -w0 dev-trader-update.json)"
          SHA="$(gh api "repos/${GITHUB_REPOSITORY}/contents/dev-trader/update.json?ref=dev-trader-v1" --jq .sha)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/dev-trader/update.json" \
            -f message="Publish KYVORIQ self-update manifest ${GITHUB_REF_NAME}" \
            -f content="${CONTENT}" \
            -f branch="dev-trader-v1" \
            -f sha="${SHA}" >/dev/null
