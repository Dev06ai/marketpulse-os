name: KYVORIQ Release

on:
  push:
    branches:
      - "dev-trader-release-*"
  workflow_dispatch:

concurrency:
  group: kyvoriq-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEV_TRADER_KEYSTORE_BASE64: ${{ secrets.DEV_TRADER_KEYSTORE_BASE64 }}
      DEV_TRADER_KEYSTORE_PASSWORD: ${{ secrets.DEV_TRADER_KEYSTORE_PASSWORD }}
      DEV_TRADER_KEY_ALIAS: ${{ secrets.DEV_TRADER_KEY_ALIAS }}
      DEV_TRADER_KEY_PASSWORD: ${{ secrets.DEV_TRADER_KEY_PASSWORD }}
      DEV_TRADER_KEYSTORE_PATH: ${{ github.workspace }}/dev-trader-release.keystore
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backend preflight
        working-directory: dev-trader/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          python -m compileall app
          pytest -q test_analytics.py test_strategy.py
      - name: Verify signing configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEV_TRADER_KEYSTORE_BASE64" || { echo "Missing DEV_TRADER_KEYSTORE_BASE64"; exit 1; }
          test -n "$DEV_TRADER_KEYSTORE_PASSWORD" || { echo "Missing DEV_TRADER_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$DEV_TRADER_KEY_ALIAS" || { echo "Missing DEV_TRADER_KEY_ALIAS"; exit 1; }
          test -n "$DEV_TRADER_KEY_PASSWORD" || { echo "Missing DEV_TRADER_KEY_PASSWORD"; exit 1; }
          echo "$DEV_TRADER_KEYSTORE_BASE64" | base64 --decode > "$DEV_TRADER_KEYSTORE_PATH"
          test -s "$DEV_TRADER_KEYSTORE_PATH"

      - name: Parse release version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          REF="$GITHUB_REF_NAME"
          if [[ "$REF" =~ ^dev-trader-v([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+)$ ]]; then
            VERSION_NAME="${BASH_REMATCH[1]}"
            VERSION_CODE="${BASH_REMATCH[2]}"
            RELEASE_TAG="$REF"
          elif [[ "$REF" =~ ^dev-trader-release-([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+)$ ]]; then
            VERSION_NAME="${BASH_REMATCH[1]}"
            VERSION_CODE="${BASH_REMATCH[2]}"
            RELEASE_TAG="dev-trader-v${VERSION_NAME}-${VERSION_CODE}"
          else
            echo "Unsupported release ref: $REF"
            exit 1
          fi
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
      - name: Validate owner-reference wordmark in BOTH header and animated intro
        shell: bash
        run: |
          set -euo pipefail
          FILE=dev-trader/android/app/src/main/java/com/devtrader/app/KyvoriqMotionIdentity.kt
          INTRO=dev-trader/android/app/src/main/java/com/devtrader/app/KyvoriqLaunchOverlay.kt
          HEADER=dev-trader/android/app/src/main/java/com/devtrader/app/SafeActivity.kt
          VECTOR=dev-trader/android/app/src/main/res/drawable/kyvoriq_concentric_wordmark.xml
          test -s "$VECTOR"
          grep -Fq 'android:fillType="evenOdd"' "$VECTOR"
          grep -Fq 'kyvoriq_concentric_wordmark' "$FILE"
          grep -Fq 'KyvoriqRazorWordmarkView(context)' "$INTRO"
          grep -Fq 'KyvoriqRazorWordmarkView(this)' "$HEADER"
          ! grep -Fq 'Typeface.create("serif"' "$FILE"
          python - <<'PY'
          import xml.etree.ElementTree as ET
          path='dev-trader/android/app/src/main/res/drawable/kyvoriq_concentric_wordmark.xml'
          root=ET.parse(path).getroot()
          tag='{http://schemas.android.com/apk/res/android}'
          assert root.tag=='vector'
          assert root.attrib[tag+'viewportWidth']=='699'
          assert root.attrib[tag+'viewportHeight']=='166'
          assert len(root)==1 and len(root[0].attrib[tag+'pathData'])>4000
          assert root[0].attrib[tag+'fillType']=='evenOdd'
          print('Owner reference wordmark vector valid, same component used by header and intro.')
          PY
      - name: Verify gold alert manager and owner-reference tagline in both views
        shell: bash
        run: |
          set -euo pipefail
          UI=dev-trader/android/app/src/main/java/com/devtrader/app/SafeActivity.kt
          INTRO=dev-trader/android/app/src/main/java/com/devtrader/app/KyvoriqLaunchOverlay.kt
          TAG=dev-trader/android/app/src/main/res/drawable/kyvoriq_trade_the_plot.xml
          test -s "$TAG"
          grep -Fq 'kyvoriq_trade_the_plot' "$UI"
          grep -Fq 'kyvoriq_trade_the_plot' "$INTRO"
          grep -Fq 'setBackgroundDrawable(android.graphics.drawable.ColorDrawable(Color.TRANSPARENT))' "$UI"
          grep -Fq 'BtcPriceAlerts.add(this, requested, livePrice)' "$UI"
          ! grep -Fq 'AI POWERED TRADING' "$UI"
          ! grep -Fq 'AI POWERED TRADING' "$INTRO"
          python - <<'PY'
          import xml.etree.ElementTree as ET
          tag='{http://schemas.android.com/apk/res/android}'
          root=ET.parse('dev-trader/android/app/src/main/res/drawable/kyvoriq_trade_the_plot.xml').getroot()
          assert root.tag=='vector'
          assert root.attrib[tag+'viewportWidth']=='281'
          assert root.attrib[tag+'viewportHeight']=='42'
          assert len(root)==1 and len(root[0].attrib[tag+'pathData'])>2000
          assert root[0].attrib[tag+'fillType']=='evenOdd'
          print('User-referenced handwritten vector and full-native alert card verified.')
          PY
      - name: Verify adaptive viewport and safe public read-only fallback
        shell: bash
        run: |
          set -euo pipefail
          UI=dev-trader/android/app/src/main/java/com/devtrader/app/SafeActivity.kt
          LAYOUT=dev-trader/android/app/src/main/java/com/devtrader/app/KyvoriqResponsiveLayout.kt
          test -s "$LAYOUT"
          test -s dev-trader/android/app/src/androidTest/java/com/devtrader/app/KyvoriqResponsiveLayoutTest.kt
          grep -Fq 'layout.compactActions' "$UI"
          grep -Fq 'layout.stackedActions' "$UI"
          grep -Fq 'enterPublicMarketMode()' "$UI"
          grep -Fq 'if (publicMarketOnly) JSONArray() else chartOverlays(latestRoot)' "$UI"
          grep -Fq 'chart.setFeedHealthy(false)' "$UI"
          grep -Fq 'Consumer upgrades are pending verification; private trading stays owner-only.' "$UI"
          grep -Fq 'if (publicMarketOnly || !KyvoriqSecureSession.isPaired(this))' "$UI"
          grep -Fq 'kyvoriq_trade_the_plot' "$UI"
          ! grep -Fq 'leftMargin = -dp(10)' "$UI"
          echo 'Public chart has no private signals, trading or fake LIVE badge.'
      - name: Verify slim 4x1 widget and reference-brand notifications
        shell: bash
        run: |
          set -euo pipefail
          INFO=dev-trader/android/app/src/main/res/xml/kyvoriq_widget_info.xml
          WIDGET=dev-trader/android/app/src/main/res/layout/widget_kyvoriq_compact.xml
          EXPANDED=dev-trader/android/app/src/main/res/layout/widget_kyvoriq_expanded.xml
          NOTIF=dev-trader/android/app/src/main/res/layout/notification_kyvoriq_collapsed.xml
          NOTIF_BIG=dev-trader/android/app/src/main/res/layout/notification_kyvoriq_expanded.xml
          SERVICE=dev-trader/android/app/src/main/java/com/devtrader/app/SignalService.kt
          PROVIDER=dev-trader/android/app/src/main/java/com/devtrader/app/KyvoriqWidgetProvider.kt
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          base=Path('dev-trader/android/app/src/main/res')
          ns='{http://schemas.android.com/apk/res/android}'
          info=ET.parse(base/'xml/kyvoriq_widget_info.xml').getroot()
          assert info.attrib[ns+'targetCellWidth']=='4'
          assert info.attrib[ns+'targetCellHeight']=='1'
          assert int(info.attrib[ns+'minHeight'].replace('dp',''))<=80
          for rel in ('layout/widget_kyvoriq_compact.xml',
                      'layout/widget_kyvoriq_expanded.xml',
                      'layout/notification_kyvoriq_collapsed.xml',
                      'layout/notification_kyvoriq_expanded.xml'):
              txt=(base/rel).read_text()
              ET.fromstring(txt)
              assert 'kyvoriq_concentric_wordmark' in txt
              assert 'fontFamily="serif"' not in txt
              assert 'AI POWERED TRADING' not in txt
          for rel in ('layout/widget_kyvoriq_expanded.xml',
                      'layout/notification_kyvoriq_expanded.xml'):
              assert 'kyvoriq_trade_the_plot' in (base/rel).read_text()
          service=Path('dev-trader/android/app/src/main/java/com/devtrader/app/SignalService.kt').read_text()
          provider=Path('dev-trader/android/app/src/main/java/com/devtrader/app/KyvoriqWidgetProvider.kt').read_text()
          assert 'views.setImageViewResource(R.id.notif_title, R.drawable.kyvoriq_concentric_wordmark)' in service
          assert 'val expanded = minHeight >= 170' in provider
          assert 'if (expanded) views.setTextViewText(R.id.widget_state' in provider
          print('Compact 4x1 widget, both notification variants and dynamic view bindings verified.')
          PY
      - name: Verify compact wordmark safety and non-invasive 404 route fallback
        run: |
          set -euo pipefail
          INTRO=dev-trader/android/app/src/main/java/com/devtrader/app/KyvoriqLaunchOverlay.kt
          UI=dev-trader/android/app/src/main/java/com/devtrader/app/SafeActivity.kt
          WIDGET=dev-trader/android/app/src/main/res/layout/widget_kyvoriq_compact.xml
          LAYOUT=dev-trader/android/app/src/main/java/com/devtrader/app/KyvoriqResponsiveLayout.kt
          ! grep -Fq 'K / /   01' "$INTRO"
          grep -Fq 'kyvoriq_emblem_intro_tight' "$INTRO"
          grep -Fq 'privateRouteFallback = true' "$UI"
          grep -Fq 'now - lastPrivateRouteProbeMs >= 12_000L' "$UI"
          grep -Fq 'if (restoredPrivateRoute)' "$UI"
          grep -Fq 'compactHeaderLabel("ALERTS ON")' "$UI"
          grep -Fq 'val narrow = width < 620' "$LAYOUT"
          grep -Fq 'wordmarkWidthDp' "$LAYOUT"
          grep -Fq 'entryChecksFullText' "$UI"
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          base=Path('dev-trader/android/app/src/main/res')
          for path in ['drawable/kyvoriq_emblem_intro_tight.xml',
                       'layout/widget_kyvoriq_compact.xml']:
              ET.parse(base/path)
          assert 'android:layout_height="25dp"' in (base/'layout/widget_kyvoriq_compact.xml').read_text()
          assert 'android:id="@+id/widget_alerts"' in (base/'layout/widget_kyvoriq_compact.xml').read_text()
          print('Source gate: intro, vector bounds, compact widget and secure transient route recovery present.')
          PY
      - name: Test consumer identity and authorization boundaries before signing
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q -r dev-trader/consumer-api/requirements.txt
          python -m unittest discover -s dev-trader/consumer-api -p 'test_*.py' -q

      - name: Build signed release APK with VERIFIED Firebase identity
        working-directory: dev-trader/android
        shell: bash
        env:
          ORG_GRADLE_PROJECT_kyvoriqFirebaseApiKey: ${{ secrets.KYVORIQ_FIREBASE_WEB_API_KEY }}
          ORG_GRADLE_PROJECT_kyvoriqFirebaseProjectId: kyvoriq
          ORG_GRADLE_PROJECT_kyvoriqFirebaseAppId: "1:320009995893:android:1ffee780b5cc138a1d5a3c"
          ORG_GRADLE_PROJECT_kyvoriqGoogleWebClientId: "320009995893-oksbnnjkjv7a0m871e70kd3fembdtf58.apps.googleusercontent.com"
          ORG_GRADLE_PROJECT_kyvoriqConsumerApiOrigin: ""
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          prop = lambda name: os.environ.get("ORG_GRADLE_PROJECT_" + name, "")
          assert re.fullmatch(r"AIza[A-Za-z0-9_-]{30,}", prop("kyvoriqFirebaseApiKey")), "Firebase Web API key missing/invalid; refusing release"
          assert prop("kyvoriqFirebaseProjectId") == "kyvoriq", "Incorrect Firebase project"
          assert re.fullmatch(r"1:[0-9]+:android:[a-fA-F0-9]+", prop("kyvoriqFirebaseAppId")), "Firebase Android registration missing"
          assert re.fullmatch(r"[0-9]+-[A-Za-z0-9_-]+[.]apps[.]googleusercontent[.]com", prop("kyvoriqGoogleWebClientId")), "Google OAuth Web client missing"
          assert prop("kyvoriqConsumerApiOrigin") == "", "Public consumer API deployment was not separately approved"
          print("Firebase credentials verified for this release; no credential values logged.")
          PY
          gradle assembleRelease \
            -PdevTraderVersionName="${{ steps.meta.outputs.version_name }}" \
            -PdevTraderVersionCode="${{ steps.meta.outputs.version_code }}" \
            --stacktrace
          python3 - <<'PY'
          import os, zipfile
          with zipfile.ZipFile("app/build/outputs/apk/release/app-release.apk") as apk:
              dex = b"".join(apk.read(n) for n in apk.namelist()
                             if n.startswith("classes") and n.endswith(".dex"))
          assert dex, "No bytecode in release APK"
          for name in ("kyvoriqFirebaseApiKey", "kyvoriqFirebaseProjectId",
                       "kyvoriqFirebaseAppId", "kyvoriqGoogleWebClientId"):
              assert os.environ["ORG_GRADLE_PROJECT_" + name].encode() in dex, "Missing compiled Firebase property: " + name
          print("APK includes registered Firebase/Google identity config; values redacted.")
          PY

      - name: Build connection recovery instrumentation
        working-directory: dev-trader/android
        run: gradle assembleDebug assembleDebugAndroidTest --stacktrace -PdevTraderVersionCode=176 -PdevTraderVersionName=0.21.51

      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Require timeout, offline cache, network reset and chart regression tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            mkdir -p recovery-qa
            adb install -r dev-trader/android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r dev-trader/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            if ! timeout -k 10s 240s adb shell am instrument -w -e class com.devtrader.app.MarketRecoveryTest,com.devtrader.app.ChartAxisRailTest,com.devtrader.app.OrderBlockPolicyTest,com.devtrader.app.KyvoriqUpdaterVisualTest com.devtrader.app.debug.test/androidx.test.runner.AndroidJUnitRunner > recovery-qa/instrumentation.txt 2>&1; then
              cat recovery-qa/instrumentation.txt
              adb logcat -d -t 2500 > recovery-qa/logcat.txt || true
              echo 'Instrumentation failed or exceeded 240 seconds; release remains blocked.'
              exit 1
            fi
            cat recovery-qa/instrumentation.txt
            grep -q 'OK (' recovery-qa/instrumentation.txt
            ! grep -E 'FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed' recovery-qa/instrumentation.txt

      - name: Preserve recovery test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyvoriq-176-recovery-evidence
          path: recovery-qa/
          retention-days: 14

      - name: Verify public Android client only contains generic level rendering
        shell: bash
        run: |
          set -euo pipefail
          test -f dev-trader/android/app/src/main/java/com/devtrader/app/MarketChartView.kt
          grep -Fq 'val tag = "TAPPED"' dev-trader/android/app/src/main/java/com/devtrader/app/MarketChartView.kt
          grep -Fq 'tapped_at_ms' dev-trader/android/app/src/main/java/com/devtrader/app/SafeActivity.kt
          ! grep -Fq 'fallbackLine("NPOC"' dev-trader/android/app/src/main/java/com/devtrader/app/SafeActivity.kt
          ! grep -Fq 'dewald_levels_2026_10_12' dev-trader/android/app/src/main/java/com/devtrader/app/SafeActivity.kt
          ! grep -Fq 'musicIsland' dev-trader/android/app/src/main/java/com/devtrader/app/SafeActivity.kt
          test ! -f dev-trader/android/app/src/main/java/com/devtrader/app/KyvoriqMusicIsland.kt
          test ! -f dev-trader/android/app/src/main/java/com/devtrader/app/KyvoriqPrivateMusic.kt
          ! find dev-trader/android/app/src/main/assets/ -type f -name '*.mp3' 2>/dev/null | grep -q .
          grep -Fq 'showConsumerAccountPanel()' dev-trader/android/app/src/main/java/com/devtrader/app/SafeActivity.kt
          grep -Fq 'CONSUMER_PORTAL_URL' dev-trader/android/app/build.gradle.kts
          grep -Fq 'refreshConsumerPresentation()' dev-trader/android/app/src/main/java/com/devtrader/app/SafeActivity.kt
          ! grep -Fq 'SYSTEM_ALERT_WINDOW' dev-trader/android/app/src/main/AndroidManifest.xml
          ! grep -Fq 'READ_MEDIA_AUDIO' dev-trader/android/app/src/main/AndroidManifest.xml
      - name: Verify reconnect failure diagnostics
        shell: bash
        run: |
          set -euo pipefail
          CLIENT=dev-trader/android/app/src/main/java/com/devtrader/app/SafeActivity.kt
          grep -Fq '"BACKEND ROUTE 404"' "$CLIENT"
          grep -Fq '"PAIRING REQUIRED"' "$CLIENT"
          grep -Fq '"HTTP FALLBACK"' "$CLIENT"
          grep -Fq '"INVALID SNAPSHOT"' "$CLIENT"
          grep -Fq 'verifiedRestSnapshot' "$CLIENT"
      - name: Verify authenticated signal-service health semantics
        shell: bash
        run: |
          set -euo pipefail
          SERVICE=dev-trader/android/app/src/main/java/com/devtrader/app/SignalService.kt
          grep -Fq 'AUTH_REQUIRED' "$SERVICE"
          grep -Fq 'authRetryAfterMs' "$SERVICE"
          grep -Fq 'A successful handshake is not evidence of valid market data' "$SERVICE"
          grep -Fq 'channelActive' "$SERVICE"
          ! grep -Fq 'updateServiceNotification(ServiceUiState.LIVE)' "$SERVICE"
      - name: Verify diagnostics error visibility
        shell: bash
        run: |
          set -euo pipefail
          CLIENT=dev-trader/android/app/src/main/java/com/devtrader/app/SafeActivity.kt
          grep -Fq 'PAIRING EXPIRED (401)' "$CLIENT"
          grep -Fq 'BACKEND ROUTE UNAVAILABLE (404)' "$CLIENT"
          grep -Fq 'PUBLIC BACKEND  •  REACHABLE' "$CLIENT"
          grep -Fq 'Bitget execution readiness  •  UNVERIFIED' "$CLIENT"
          grep -Fq 'if (!bootstrapFresh && lastHardHttpStatus == null)' "$CLIENT"
          ! grep -Fq 'Backend diagnostics failed.' "$CLIENT"
      - name: Verify matching Build 169 signing certificate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT="dev-trader/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$CURRENT"
          mkdir -p /tmp/kyvoriq-prior
          gh release download dev-trader-v0.21.44-169 --pattern app-release.apk --dir /tmp/kyvoriq-prior
          PREVIOUS="/tmp/kyvoriq-prior/app-release.apk"
          test -s "$PREVIOUS"
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$(find "$SDKROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$SDKROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          test -n "$AAPT"
          "$APKSIGNER" verify --verbose "$PREVIOUS" >/dev/null
          "$APKSIGNER" verify --verbose "$CURRENT" >/dev/null
          "$APKSIGNER" verify --print-certs "$PREVIOUS" > /tmp/kyvoriq-prior-certificate.txt
          "$APKSIGNER" verify --print-certs "$CURRENT" > /tmp/kyvoriq-current-certificate.txt
          PREVIOUS_CERT="$(awk '/certificate SHA-256 digest:/ {print $NF; exit}' /tmp/kyvoriq-prior-certificate.txt)"
          CURRENT_CERT="$(awk '/certificate SHA-256 digest:/ {print $NF; exit}' /tmp/kyvoriq-current-certificate.txt)"
          test -n "$PREVIOUS_CERT" || { echo "Prior certificate fingerprint unavailable"; exit 1; }
          test -n "$CURRENT_CERT" || { echo "New certificate fingerprint unavailable"; exit 1; }
          test "$PREVIOUS_CERT" = "$CURRENT_CERT" || { echo "Different APK signing identity: release refused"; exit 1; }
          "$AAPT" dump badging "$CURRENT" > /tmp/kyvoriq-new-package.txt
          grep -Fq "package: name='com.devtrader.app' versionCode='${{ steps.meta.outputs.version_code }}' versionName='${{ steps.meta.outputs.version_name }}'" /tmp/kyvoriq-new-package.txt || { echo "Package identifier or version mismatch"; exit 1; }
          ! unzip -l "$CURRENT" | grep -Ei 'ui_preview.json|signing.jks|\.env'
          echo "Build ${{ steps.meta.outputs.version_code }} package, version, signature and preview exclusion verified."

      - name: Prepare release metadata
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.release_tag }}"
          VERSION_NAME="${{ steps.meta.outputs.version_name }}"
          VERSION_CODE="${{ steps.meta.outputs.version_code }}"
          APK="dev-trader/android/app/build/outputs/apk/release/app-release.apk"
          SHA256="$(sha256sum "$APK" | cut -d " " -f1)"
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/app-release.apk"
          cat > dev-trader-update.json <<EOF
          {
            "enabled": true,
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "apkUrl": "${APK_URL}",
            "sha256": "${SHA256}",
            "notes": "Signed KYVORIQ release ${VERSION_NAME}"
          }
          EOF
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Require exact Build 171 device QA pass before publishing
        if: steps.meta.outputs.version_code == '171'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          QA_RUN=38577108443
          QA_HEAD=652a6ae709109d34807e55c2807fd0e7d1969d47
          for attempt in $(seq 1 54); do
            INFO="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${QA_RUN}" \
              --jq '[.head_sha,.status,(.conclusion // "")] | join(" ")')"
            read -r SHA STATE CONCLUSION <<< "$INFO"
            test "$SHA" = "$QA_HEAD" || { echo "QA source identity mismatch"; exit 1; }
            if [[ "$CONCLUSION" = success ]]; then
              echo "Full Build 171 device QA passed on exact chart/source revision."
              break
            fi
            if [[ "$STATE" = completed ]]; then
              echo "Full Build 171 QA failed: $CONCLUSION"; exit 1
            fi
            if [[ "$attempt" = 54 ]]; then
              echo "Full Build 171 QA still pending; refusing public update release"; exit 1
            fi
            sleep 10
          done
          git diff --quiet dev-trader/android/app/src/main/java/com/devtrader/app/MarketChartView.kt
          git diff --quiet dev-trader/android/app/src/main/java/com/devtrader/app/SafeActivity.kt

      - name: Create release tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.release_tag }}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists."
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f "ref=refs/tags/${TAG}" -f "sha=${GITHUB_SHA}" >/dev/null
            echo "Created tag ${TAG} at ${GITHUB_SHA}."
          fi

      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.release_tag }}"
          APK="dev-trader/android/app/build/outputs/apk/release/app-release.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Existing signed APK must not be replaced."
            exit 1
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" "$APK" "dev-trader-update.json#dev-trader-update.json" --title "KYVORIQ ${{ steps.meta.outputs.version_name }}" --notes "Signed KYVORIQ Build ${{ steps.meta.outputs.version_code }}: automatic recovery from timeouts and network changes; independent public chart fallback; validated offline candle cache with stale labels; repaired background stale-socket recovery. Preserves Build 175 chart labels, account UI, signing identity and execution safeguards. Device regression tests are required before publication."

      - name: Publish update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          CONTENT="$(base64 -w0 dev-trader-update.json)"
          SHA="$(gh api "repos/${GITHUB_REPOSITORY}/contents/dev-trader/update.json?ref=dev-trader-v1" --jq .sha)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/dev-trader/update.json" \
            -f message="Publish KYVORIQ self-update manifest ${GITHUB_REF_NAME}" \
            -f content="${CONTENT}" \
            -f branch="dev-trader-v1" \
            -f sha="${SHA}" >/dev/null
