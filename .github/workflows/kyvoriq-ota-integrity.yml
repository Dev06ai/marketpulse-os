name: KYVORIQ OTA signed-release integrity guard
on:
  push:
    branches:
      - dev-trader-v1
      - ci/kyvoriq-ota-integrity-watch-20261014
    paths:
      - .github/workflows/kyvoriq-ota-integrity.yml
      - dev-trader/update.json
      - dev-trader/tools/check_ota_release.py
      - dev-trader/tools/test_check_ota_release.py
permissions:
  contents: read
concurrency:
  group: kyvoriq-ota-readonly-integrity
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out read-only verifier
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test verifier with synthetic non-sensitive fixtures
        run: python3 -m unittest discover -s dev-trader/tools -p test_check_ota_release.py -v
      - name: Fetch current authoritative OTA manifest and release metadata
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/contents/dev-trader/update.json?ref=dev-trader-v1" \
            --jq .content | base64 --decode > "$RUNNER_TEMP/ota-manifest.json"
          TAG="$(python3 - "$RUNNER_TEMP/ota-manifest.json" <<'PY'
          import json,sys,re
          m=json.load(open(sys.argv[1]))
          if m.get('enabled') is not True: raise SystemExit('OTA disabled; fail closed')
          code=m.get('versionCode')
          ver=m.get('versionName')
          if type(code) is not int or code<1 or not isinstance(ver,str) or not re.fullmatch(r'\d+\.\d+\.\d+',ver):
              raise SystemExit('Invalid version identity')
          print(f'dev-trader-v{ver}-{code}')
          PY
          )"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/ota-release.json"
          mkdir -p "$RUNNER_TEMP/verified-apk"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern app-release.apk --dir "$RUNNER_TEMP/verified-apk"
          test -s "$RUNNER_TEMP/verified-apk/app-release.apk"
      - name: Verify actual downloaded SHA, GitHub asset, package, version and original signer
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$AAPT"
          test -x "$SIGNER"
          python3 dev-trader/tools/check_ota_release.py \
            --manifest "$RUNNER_TEMP/ota-manifest.json" \
            --release "$RUNNER_TEMP/ota-release.json" \
            --apk "$RUNNER_TEMP/verified-apk/app-release.apk" \
            --aapt "$AAPT" --apksigner "$SIGNER"
          echo 'KYVORIQ_OTA_INTEGRITY_PASSED_NO_DEPLOY_OR_TRADING_ACTION'
