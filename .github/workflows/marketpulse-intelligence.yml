name: MarketPulse Continuous Intelligence

on:
  # MarketPulse has been retired. Keep this workflow manual-only so the old
  # intelligence scheduler cannot wake suspended MarketPulse infrastructure
  # or consume GitHub Actions minutes.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketpulse-intelligence
  cancel-in-progress: false

jobs:
  intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      MARKETPULSE_WEB_URL: https://marketpulse-os-d4p9.onrender.com
      MARKETPULSE_WORKER_ENABLED: "true"
      MARKETPULSE_WORKER_SYMBOLS: BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,XRPUSDT,DOGEUSDT,ADAUSDT
      MARKETPULSE_WORKER_INTERVALS: 15m,1h,4h,1d
      MARKETPULSE_WORKER_DEVICE: github-actions-24x7
      MARKETPULSE_WORKER_TIMEOUT_MS: "30000"
      MARKETPULSE_WORKER_JITTER_MS: "1500"
      MARKETPULSE_WORKER_RETRIES: "3"
      MARKETPULSE_WORKER_RETRY_BASE_MS: "1200"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Retired-workflow guard
        run: |
          echo "MarketPulse Continuous Intelligence is retired; no scheduled sweep will run."

