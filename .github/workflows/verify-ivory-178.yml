name: KYVORIQ 178 ivory motion + alerts Android QA
on:
  push:
    branches: [ui/ivory-alerts-fluid-178]
    paths:
      - dev-trader/android/**
      - .github/workflows/verify-ivory-178.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Verify important alerts remain and custom LIVE card is unused
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root = Path('dev-trader/android/app/src/main/java/com/devtrader/app')
          service = (root/'SignalService.kt').read_text()
          activity = (root/'SafeActivity.kt').read_text()
          pill = (root/'IvoryPillStrip.kt').read_text()
          assert 'startForeground(' in service
          assert 'setCustomContentView(' not in service
          assert 'setCustomBigContentView(' not in service
          assert 'if (tier == "INFO") return' in service
          for marker in ('notifyVerifiedTradeEventOnce(', 'notifyTradeEvent(', 'checkCustomPriceAlerts(', 'alertChannelForTier(', 'POST_NOTIFICATIONS'):
              assert marker in service, marker
          for marker in ('showConsumerAccountPanel()', 'KyvoriqSecureSession.accessToken(this)', 'startSystemUpdateDownload(', 'refreshTimeframeButtons(', 'positionLiquidIndicator('):
              assert marker in activity, marker
          assert 'IvoryPillStrip(this)' in activity
          assert 'KyvoriqTheme.motionEnabled(context)' in pill
          print('IVORY_AND_ALERTS_STATIC_CONTRACT_OK')
          PY
      - name: Compile debug APK and Android instrumentation suite (no private credentials)
        working-directory: dev-trader/android
        run: gradle assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace -PdevTraderVersionCode=178 -PdevTraderVersionName=0.21.53
      - name: Check APK presence and no bundled signing secrets
        shell: bash
        run: |
          set -euo pipefail
          APK=dev-trader/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          ! unzip -l "$APK" | grep -Ei 'keystore|signing\.jks|\.env$'
          echo "KYVORIQ 178 DEBUG APK COMPILED; NOT A SIGNED UPDATE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kyvoriq-178-ivory-debug-validation
          path: |
            dev-trader/android/app/build/outputs/apk/debug/
            dev-trader/android/app/build/reports/
          retention-days: 7
