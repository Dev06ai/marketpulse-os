name: Validate MarketPulse
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check server.js
      - run: node --check market-engine.js
      - run: node --check market-structure.js
      - run: node --check strategy-setups.js
      - run: node --check reaction-map.js
      - run: node --check analyst-scenario-pack.js
      - run: node --check advanced-price-action-pack.js
      - run: node --check advanced-elliott-wave.js
      - run: node --check phase11-13.js
      - run: node --check phase14-signal-intelligence.js
      - run: node --check market-structure.js
      - run: node validation-selftest.js
      - run: node --check storage.js
      - run: node --check learning.js
      - run: node --check phase4.js
      - run: node --check execution.js
      - run: node --check phase6.js
      - run: node --check prop-firm.js
      - run: node --check research-data.js
      - run: node --check data-fabric.js
      - run: node --check phase18-market-state.js
      - run: node --check phase21-state-contract.js
      - run: node --check phase22-state-bus.js
      - run: node --check phase23-signal-hysteresis.js
      - run: node --check phase24-data-quality.js
      - run: node --check phase25-flow-normalizer.js
      - run: node --check phase26-regime-engine.js
      - run: node --check phase27-structure-graph.js
      - run: node --check phase28-confluence.js
      - run: node --check phase29-calibration.js
      - run: node --check phase30-risk-engine.js
      - run: node --check phase31-backtest-engine.js
      - run: node --check phase32-walk-forward.js
      - run: node --check phase33-monte-carlo.js
      - run: node --check phase34-paper-broker.js
      - run: node --check phase35-execution-model.js
      - run: node --check phase36-forensics.js
      - run: node --check phase37-learning-guardrails.js
      - run: node --check phase38-drift-detection.js
      - run: node --check phase39-calibration-audit.js
      - run: node --check phase40-anomaly-detector.js
      - run: node --check phase41-kill-switch.js
      - run: node --check phase42-observability.js
      - run: node --check phase43-phase-ledger.js
      - run: node --check phase44-explainability.js
      - run: node --check phase45-security-review.js
      - run: node --check phase46-deployment-gate.js
      - run: node --check phase47-recovery.js
      - run: node --check phase48-performance-budget.js
      - run: node --check phase49-live-readiness.js
      - run: node --check phase50-shadow-controller.js
      - run: node --check phase21-50-stack.js
      - run: for f in phase5[1-9]-*.js phase[6-9][0-9]-*.js phase100-*.js; do node --check "$f"; done
      - run: node --check phase51-100-stack.js
      - run: node phase51-100-selftest.js
      - name: Check Phase 101–200 Intelligence OS
        run: node --check phase101-200-intelligence.js && node --check phase101-200-stack.js
      - run: node phase101-200-selftest.js
      - run: node tests/phase101-200.js

      - run: node --check phase18-opportunity.js
      - run: node --check phase18-execution-router.js
      - run: node --check marketpulse-autotrader.js
      - run: node tests/phase18.js
      - run: node --check marketpulse-worker.js
      - run: node tests/marketpulse-worker.js
      - run: node tests/smoke.js
      - run: node tests/prop-firm.js
      - run: node tests/data-fabric.js
      - run: node tests/phase7.js
      - run: node tests/reaction-map.js
      - run: node tests/sfp-signal.js
      - run: node tests/dline-checklist.js
      - run: node tests/advanced-price-action.js
      - run: node tests/advanced-elliott-wave.js
      - run: node tests/analyst-scenario-pack.js
      - run: node tests/phase14-signal-intelligence.js
      - run: node tests/phase51-100.js
      - run: node tests/mindpillar-knowledge.js
      - name: Check all browser scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("public/index.html").read_text()
          tags = list(re.finditer(r"<script\b[^>]*>", html, re.I))
          if not tags:
              raise SystemExit("No browser scripts found")
          for i, tag in enumerate(tags, 1):
              start = tag.end()
              end = html.find("</script>", start)
              if end < 0:
                  raise SystemExit(f"Script {i} has no closing tag")
              Path(f"/tmp/browser-{i}.js").write_text(html[start:end])
          print(f"Extracted {len(tags)} browser scripts")
          PY
          for f in /tmp/browser-*.js; do
            echo "Checking $f"
            node --check "$f"
          done

      # The 2025 inline-html terminal was replaced by the Apex /app.js
      # runtime. Old checks here referenced removed DOM IDs and functions and
      # were no longer capable of validating the shipped UI. The replacement
      # executes the current renderer with fail-closed signal fixtures, while
      # all backend/strategy/risk tests above remain mandatory.
      - name: Check current Apex terminal safety and UI
        run: node tests/current-apex-ui-contract.js

      - name: Check phase registry
        run: |
          node - <<'NODE'
          const h=require('./phase-history');
          if(h.getPhaseHistory().length!==500)throw new Error('Phase registry must contain exactly 500 phases');
          if(h.getCurrentPhase()!==20)throw new Error('Only validated historical phases 1-20 may be marked complete on this branch');
          console.log('Phase registry OK');
          NODE
