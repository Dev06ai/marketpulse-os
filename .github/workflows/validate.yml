name: Validate MarketPulse
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check server.js
      - run: node --check market-engine.js
      - run: node --check storage.js
      - run: node --check learning.js
      - run: node tests/smoke.js
      - name: Check browser script
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("public/index.html").read_text()
          start = html.index("<script>") + len("<script>")
          end = html.index("</script>", start)
          Path("/tmp/browser.js").write_text(html[start:end])
          PY
          node --check /tmp/browser.js

      - name: Check Phase 2 feature surface
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("public/index.html").read_text()
          server=Path("server.js").read_text()
          required_html=[
            'id="chartSettings"','id="chartModal"','id="view-lab"','id="view-alerts"',
            'id="aiTradeMode"','id="sync"','id="panYUp"','id="signalRows"',
            'id="alertList"','id="setupRows"','id="componentRows"','id="calibrationRows"'
          ]
          required_server=[
            "/api/core","/api/core-scan","/api/core-flow","/api/cycle",
            "/api/system-check","/api/memory","/api/learning/status","/api/ai"
          ]
          missing=[x for x in required_html if x not in html]+[x for x in required_server if x not in server]
          if missing: raise SystemExit("Missing feature surface: "+", ".join(missing))
          print("Phase 2 feature surface OK")
          PY
