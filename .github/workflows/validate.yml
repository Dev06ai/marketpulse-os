name: Validate MarketPulse
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check server.js
      - run: node --check market-engine.js
      - run: node --check market-structure.js
      - run: node --check strategy-setups.js
      - run: node --check phase11-13.js
      - run: node --check market-structure.js
      - run: node validation-selftest.js
      - run: node --check storage.js
      - run: node --check learning.js
      - run: node --check phase4.js
      - run: node --check execution.js
      - run: node --check phase6.js
      - run: node --check prop-firm.js
      - run: node --check research-data.js
      - run: node --check data-fabric.js
      - run: node tests/smoke.js
      - run: node tests/prop-firm.js
      - run: node tests/data-fabric.js
      - run: node tests/phase7.js
      - name: Check browser script
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("public/index.html").read_text()
          tag = html.index("<script")
          start = html.index(">", tag) + 1
          end = html.index("</script>", start)
          Path("/tmp/browser.js").write_text(html[start:end])
          PY
          node --check /tmp/browser.js

      - name: Check single authoritative signal UI
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("public/index.html").read_text()
          start=html.index("function renderMarket(){")
          end=html.index("\nfunction renderScanner(){",start)
          market=html[start:end]
          forbidden=[
            'mCall).textContent',
            'mBias).textContent',
            'mScore).textContent',
            'thesisTitle',
            'thesisScore',
            'entry").textContent',
            'stop").textContent',
            'target").textContent',
            'rr").textContent'
          ]
          bad=[x for x in forbidden if x in market]
          if bad: raise SystemExit("Raw renderMarket still writes authoritative signal fields: "+", ".join(bad))
          if 'function renderFinalDecision(d)' not in html: raise SystemExit("Final decision renderer missing")
          print("Single authoritative signal UI check OK")
          PY

      - name: Check charcoal quick calculator styling
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("public/index.html").read_text()
          assert 'id="quickCalculators"' in html
          assert 'Quick calculator redesign — charcoal / clean / no green surfaces' in html
          assert '.quickCalculators .calcBox' in html
          assert 'background:#101116' in html
          assert 'background:#0a0b0e' in html
          assert '.quickCalculators .result' in html
          print("Charcoal quick calculator styling checks OK")
          PY

      - name: Check clean overview charts
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("public/index.html").read_text()
          assert 'Long-term cycle score · subtle phase zones · hover for BTC context' in html
          assert 'Distance below high-water · cleaner risk view · hover for BTC context.' in html
          assert 'function drawOverviewSpecial(id,sets,height)' in html
          # Old right-axis label clutter must not return.
          start=html.index('function drawOverviewSpecial(id,sets,height)')
          end=html.index('\nfunction bindMiniHover',start)
          chart=html[start:end]
          assert 'BTC PRICE' not in chart
          assert 'DRAWDOWN FROM HIGH-WATER' in chart
          assert 'CYCLE SCORE' in chart
          print("Clean overview chart checks OK")
          PY

      - name: Check stable live status bar
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("public/index.html").read_text()
          start=html.index("async function loadCore(){")
          end=html.index("\nasync function askAI(){",start)
          core=html[start:end]
          assert 'var hasMarket=Boolean(state.market&&state.market.analysis)' in core
          assert 'if(!hasMarket){setStatus("Loading BTC market data…");' in core
          assert 'if(sb&&sb.textContent!=="Live market data connected")setStatus("Live market data connected","ok")' in core
          print("Stable live status bar checks OK")
          PY

      - name: Check non-disruptive background retry handling
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("public/index.html").read_text()
          start=html.index("async function loadCore(){")
          end=html.index("\nasync function askAI(){",start)
          core=html[start:end]
          decision=html[html.index("async function loadFinalDecision()"):html.index("\nasync function loadCore(){",html.index("async function loadFinalDecision()"))]
          assert 'if(state.market&&state.market.analysis)' in core
          assert 'Live · last good snapshot' in core
          assert 'if(state.finalDecision)' in decision
          assert 'keeping the last confirmed decision' in decision
          print("Background retry is non-disruptive")
          PY

      - name: Check smooth refresh rendering
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("public/index.html").read_text()
          assert 'function setupCanvas(c,height)' in html
          assert 'var needsResize=c.width!==pxW||c.height!==pxH;' in html
          assert 'if(needsResize){c.width=pxW;c.height=pxH;}' in html
          assert 'if(!state.chartPinned)drawMain();' in html
          assert 'REFRESHING MARKET DATA · last confirmed decision remains visible' in html
          # A normal 12s decision refresh must not call the full signal suppressor.
          start=html.index("async function loadCore(){")
          end=html.index("\nasync function askAI(){",start)
          core=html[start:end]
          assert 'suppressFinalSignal("Waiting for the first confirmed final decision.")' in core
          assert 'suppressFinalSignal("Refreshing final decision' not in core
          print("Smooth refresh rendering checks OK")
          PY

      - name: Check independent chart timeframe refresh
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("public/index.html").read_text()
          assert 'chartPinned:false' in html
          assert 'state.chartPinned=true' in html
          assert 'async function refreshPinnedChart()' in html
          # The core refresh must not unconditionally overwrite chartInterval.
          start=html.index("async function loadCore(){")
          end=html.index("\nasync function askAI(){",start)
          core=html[start:end]
          if 'state.chartInterval=requestedInterval;markChartTimeframe(requestedInterval);' in core:
              raise SystemExit("loadCore still overwrites the manually selected chart timeframe")
          assert 'refreshPinnedChart' in core
          print("Independent chart timeframe refresh check OK")
          PY

      - name: Check final signal chart and learning authority
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("public/index.html").read_text()
          phase4=Path("phase4.js").read_text()
          phase9=Path("phase9-10.js").read_text()
          learning=Path("learning.js").read_text()
          server=Path("server.js").read_text()
          assert 'function updateFinalDecision' in phase4
          assert 'function observeFinalDecision' in learning
          assert 'FINAL_GATED' in learning
          assert 'Paper learning must only consume' in phase4
          assert 'liveSignalEligible===true' in phase4
          assert 'tradeStyle' in phase9
          assert 'var final=state.finalDecision' in html
          assert 'var model=finalEligible?final.levels:null' in html
          assert 'buildDecisionSnapshot(symbol,interval,u.searchParams,requestDevice(req))' in server
          assert 'Execution preparation is allowed only from a final gated LONG/SHORT decision.' in server
          print("Final signal authority, paper-learning, chart-level, and trade-style checks OK")
          PY

      - name: Check signal authority and refresh race guards
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("public/index.html").read_text()
          server=Path("server.js").read_text()
          prop=Path("prop-firm.js").read_text()
          required_html=[
            "finalDecisionSeq",
            "suppressFinalSignal",
            'if(seq!==state.finalDecisionSeq',
            'CANDIDATE LONG',
            'CANDIDATE SHORT'
          ]
          if any(x not in html for x in required_html):
            raise SystemExit("Missing signal authority/race guard surface")
          if "process.env.PROP_MIN_SIGNAL_SCORE||78" not in server:
            raise SystemExit("Server prop-firm threshold is not aligned to 78")
          if "minSignalScore: 78" not in prop:
            raise SystemExit("Prop-firm default threshold is not 78")
          start=html.index("function renderMarket(){")
          end=html.index("\nfunction renderScanner(){",start)
          raw=html[start:end]
          forbidden=['mCall).textContent','mBias).textContent','mScore).textContent','thesisTitle','thesisScore','entry").textContent','stop").textContent','target").textContent','rr").textContent']
          bad=[x for x in forbidden if x in raw]
          if bad:
            raise SystemExit("Raw renderMarket writes authoritative signal fields: "+", ".join(bad))
          print("Signal authority, race guards, candidate labeling and threshold alignment OK")
          PY

      - name: Check Phase 2 feature surface
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("public/index.html").read_text()
          server=Path("server.js").read_text()
          required_html=[
            'id="chartSettings"','id="chartModal"','id="view-lab"','id="view-alerts"',
            'id="aiTradeMode"','id="sync"','id="chartCandles"','id="chartLine"','id="chartAuto"','id="signalRows"',
            'id="alertList"','id="setupRows"','id="componentRows"','id="calibrationRows"',
            'id="view-replay"','id="view-dna"','id="view-research"',
            'id="loadReplay"','id="replayCanvas"','id="refreshDNA"','id="dnaRows"',
            'id="runResearch"','id="resRegime"','id="resScore"','id="view-edge"','id="edgeSignal"','id="edgeQualityRows"','id="edgeOpenRows"','id="edgePersonalRows"'
          ]
          required_server=[
            "/api/core","/api/core-scan","/api/core-flow","/api/cycle",
            "/api/system-check","/api/memory","/api/learning/status","/api/ai",
            "/api/replay","/api/dna","/api/dna/refresh","/api/research","/api/edge","/api/edge/health","/api/edge/config","/api/edge/journal"
          ]
          missing=[x for x in required_html if x not in html]+[x for x in required_server if x not in server]
          if missing: raise SystemExit("Missing feature surface: "+", ".join(missing))
          print("Phase 2 feature surface OK")
          PY

      - name: Check Phase 5 feature surface
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("public/index.html").read_text()
          server=Path("server.js").read_text()
          required_html=[
            'data-view="execution"','id="view-execution"','id="exMode"','id="exGate"',
            'id="exReconcileBtn"','id="exPrepare"','id="exSubmit"','id="exKill"','id="exArm"',
            'id="exOrderRows"','id="exPositionRows"','id="exHealthRows"'
          ]
          required_server=[
            "/api/execution","/api/execution/config","/api/execution/arm","/api/execution/kill",
            "/api/execution/reconcile","/api/execution/prepare","/api/execution/intent",
            "/api/execution/submit","/api/execution/cancel","/api/execution/close-sim"
          ]
          missing=[x for x in required_html if x not in html]+[x for x in required_server if x not in server]
          if missing: raise SystemExit("Missing Phase 5 feature surface: "+", ".join(missing))
          print("Phase 5 feature surface OK")
          PY

      - name: Check Phase 6 feature surface
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("public/index.html").read_text()
          server=Path("server.js").read_text()
          required_html=[
            'data-view="portfolio"','id="view-portfolio"','id="pfRisk"','id="pfExposure"',
            'id="pfGuard"','id="pfAssetRows"','id="pfClusterRows"','id="pfCorrMatrix"',
            'id="pfStress"','id="pfSaveConfig"','id="pfRefresh"'
          ]
          required_server=[
            "/api/portfolio","/api/portfolio/config","/api/portfolio/health"
          ]
          missing=[x for x in required_html if x not in html]+[x for x in required_server if x not in server]
          if missing: raise SystemExit("Missing Phase 6 feature surface: "+", ".join(missing))
          print("Phase 6 feature surface OK")
          PY


      - name: Check final decision state sanitization
        run: |
          python - <<'PY'
          from pathlib import Path
          server=Path("server.js").read_text()
          html=Path("public/index.html").read_text()
          required_server=["function sanitizeFinalDecision","candidateEvidence","liveSignalEligible:false",'type:"NO TRADE"']
          required_html=['var side=d.liveSignalEligible===true&&d.state==="READY"']
          missing=[x for x in required_server if x not in server]+[x for x in required_html if x not in html]
          if missing: raise SystemExit("Missing final decision sanitization: "+", ".join(missing))
          print("Final decision state sanitization surface OK")
          PY

      - name: Check prop and research feature surface
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("public/index.html").read_text()
          server=Path("server.js").read_text()
          required_html=[
            'id="pfgGateChip"','id="pfgRefresh"','id="ecgGateChip"','id="ecgRefresh"','id="dcfState"','id="dcfRefresh"',
            'id="pfgEvalAccount"','id="pfgRiskTrade"','id="ecgPremium"','id="ecgPayout"','id="ecgVenue"','id="ecgStrike"','id="ecgExpiryMin"'
          ]
          required_server=[
            "/api/propfirm","/api/propfirm/event","/api/data-fabric","/api/research/catalog","/api/research/status","/api/research/train"
          ]
          missing=[x for x in required_html if x not in html]+[x for x in required_server if x not in server]
          if missing: raise SystemExit("Missing prop/research feature surface: "+", ".join(missing))
          import re
          static_html=html.split("<script",1)[0]
          ids=re.findall(r'\bid="([^"]+)"', static_html)
          dup=sorted({x for x in ids if ids.count(x)>1})
          if dup: raise SystemExit("Duplicate static HTML ids: "+", ".join(dup))
          print("Prop/research feature surface OK; static HTML ids unique")
          PY
