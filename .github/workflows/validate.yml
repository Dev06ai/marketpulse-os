name: Validate MarketPulse
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check server.js
      - run: node --check market-engine.js
      - run: node --check storage.js
      - run: node --check learning.js
      - run: node --check phase4.js
      - run: node --check execution.js
      - run: node --check phase6.js
      - run: node --check prop-firm.js
      - run: node --check research-data.js
      - run: node --check data-fabric.js
      - run: node tests/smoke.js
      - run: node tests/prop-firm.js
      - run: node tests/data-fabric.js
      - name: Check browser script
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("public/index.html").read_text()
          tag = html.index("<script")
          start = html.index(">", tag) + 1
          end = html.index("</script>", start)
          Path("/tmp/browser.js").write_text(html[start:end])
          PY
          node --check /tmp/browser.js

      - name: Check Phase 2 feature surface
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("public/index.html").read_text()
          server=Path("server.js").read_text()
          required_html=[
            'id="chartSettings"','id="chartModal"','id="view-lab"','id="view-alerts"',
            'id="aiTradeMode"','id="sync"','id="panYUp"','id="signalRows"',
            'id="alertList"','id="setupRows"','id="componentRows"','id="calibrationRows"',
            'id="view-replay"','id="view-dna"','id="view-research"',
            'id="loadReplay"','id="replayCanvas"','id="refreshDNA"','id="dnaRows"',
            'id="runResearch"','id="resRegime"','id="resScore"','id="view-edge"','id="edgeSignal"','id="edgeQualityRows"','id="edgeOpenRows"','id="edgePersonalRows"'
          ]
          required_server=[
            "/api/core","/api/core-scan","/api/core-flow","/api/cycle",
            "/api/system-check","/api/memory","/api/learning/status","/api/ai",
            "/api/replay","/api/dna","/api/dna/refresh","/api/research","/api/edge","/api/edge/health","/api/edge/config","/api/edge/journal"
          ]
          missing=[x for x in required_html if x not in html]+[x for x in required_server if x not in server]
          if missing: raise SystemExit("Missing feature surface: "+", ".join(missing))
          print("Phase 2 feature surface OK")
          PY

      - name: Check Phase 5 feature surface
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("public/index.html").read_text()
          server=Path("server.js").read_text()
          required_html=[
            'data-view="execution"','id="view-execution"','id="exMode"','id="exGate"',
            'id="exReconcileBtn"','id="exPrepare"','id="exSubmit"','id="exKill"','id="exArm"',
            'id="exOrderRows"','id="exPositionRows"','id="exHealthRows"'
          ]
          required_server=[
            "/api/execution","/api/execution/config","/api/execution/arm","/api/execution/kill",
            "/api/execution/reconcile","/api/execution/prepare","/api/execution/intent",
            "/api/execution/submit","/api/execution/cancel","/api/execution/close-sim"
          ]
          missing=[x for x in required_html if x not in html]+[x for x in required_server if x not in server]
          if missing: raise SystemExit("Missing Phase 5 feature surface: "+", ".join(missing))
          print("Phase 5 feature surface OK")
          PY

      - name: Check Phase 6 feature surface
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("public/index.html").read_text()
          server=Path("server.js").read_text()
          required_html=[
            'data-view="portfolio"','id="view-portfolio"','id="pfRisk"','id="pfExposure"',
            'id="pfGuard"','id="pfAssetRows"','id="pfClusterRows"','id="pfCorrMatrix"',
            'id="pfStress"','id="pfSaveConfig"','id="pfRefresh"'
          ]
          required_server=[
            "/api/portfolio","/api/portfolio/config","/api/portfolio/health"
          ]
          missing=[x for x in required_html if x not in html]+[x for x in required_server if x not in server]
          if missing: raise SystemExit("Missing Phase 6 feature surface: "+", ".join(missing))
          print("Phase 6 feature surface OK")
          PY


      - name: Check prop and research feature surface
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("public/index.html").read_text()
          server=Path("server.js").read_text()
          required_html=[
            'id="pfgGateChip"','id="pfgRefresh"','id="ecgGateChip"','id="ecgRefresh"','id="dcfState"','id="dcfRefresh"',
            'id="pfgEvalAccount"','id="pfgRiskTrade"','id="ecgPremium"','id="ecgPayout"','id="ecgVenue"','id="ecgStrike"','id="ecgExpiryMin"'
          ]
          required_server=[
            "/api/propfirm","/api/propfirm/event","/api/data-fabric","/api/research/catalog","/api/research/status","/api/research/train"
          ]
          missing=[x for x in required_html if x not in html]+[x for x in required_server if x not in server]
          if missing: raise SystemExit("Missing prop/research feature surface: "+", ".join(missing))
          import re
          static_html=html.split("<script",1)[0]
          ids=re.findall(r'\bid="([^"]+)"', static_html)
          dup=sorted({x for x in ids if ids.count(x)>1})
          if dup: raise SystemExit("Duplicate static HTML ids: "+", ".join(dup))
          print("Prop/research feature surface OK; static HTML ids unique")
          PY
