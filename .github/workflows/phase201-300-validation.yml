name: Phase 201-300 Validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: node --check phase201-300-profit-engine.js
      - run: node phase201-300-selftest.js
      - run: npm test
