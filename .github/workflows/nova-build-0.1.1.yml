name: NOVA 0.1.1 isolated build

on:
  push:
    branches:
      - nova-build-0.1.1
    paths:
      - 'nova-build/chunks/**'
      - '.github/workflows/nova-build-0.1.1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout compiler branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned Android 35 toolchain
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
          test -f "$ANDROID_SDK_ROOT/platforms/android-35/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2"
          test -f "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar"

      - name: Restore and verify clean NOVA source
        shell: bash
        run: |
          rm -rf /tmp/nova-src /tmp/nova-artifact
          mkdir -p /tmp/nova-src
          cat nova-build/chunks/00.b64 nova-build/chunks/01.b64 nova-build/chunks/02.b64 nova-build/chunks/03.b64 nova-build/chunks/04.b64 nova-build/chunks/05.b64 > /tmp/NOVA-0.1.1-source.b64
          base64 -d /tmp/NOVA-0.1.1-source.b64 > /tmp/NOVA-0.1.1-source.zip
          echo '6e62d8060a92b6f4a99c5175e9f07520d3dd99d1badaa1e28a6cb03990fcb49c  /tmp/NOVA-0.1.1-source.zip' | sha256sum -c -
          unzip -q /tmp/NOVA-0.1.1-source.zip -d /tmp/nova-src
          test -f /tmp/nova-src/NOVA-0.1.1/tools/build.py
          ! unzip -l /tmp/NOVA-0.1.1-source.zip | grep -Eqi '(\.jks|\.keystore|password\.txt|/signing/)'

      - name: Run NOVA security policy tests
        shell: bash
        run: |
          cd /tmp/nova-src/NOVA-0.1.1
          python3 tests/security_manifest_test.py
          python3 tests/ui_policy_test.py

      - name: Build unsigned aligned APK
        shell: bash
        env:
          NOVA_ANDROID_SDK: /usr/local/lib/android/sdk
        run: |
          cd /tmp/nova-src/NOVA-0.1.1
          python3 tools/build.py --unsigned
          test -f build/nova-unsigned.apk

      - name: Prepare local-signing bundle
        shell: bash
        run: |
          mkdir -p /tmp/nova-artifact
          cp /tmp/nova-src/NOVA-0.1.1/build/nova-unsigned.apk /tmp/nova-artifact/NOVA-0.1.1-unsigned-aligned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar" /tmp/nova-artifact/apksigner.jar
          sha256sum /tmp/nova-artifact/* > /tmp/nova-artifact/SHA256SUMS.txt

      - name: Upload compiler output
        uses: actions/upload-artifact@v4
        with:
          name: nova-0.1.1-local-signing-bundle
          path: /tmp/nova-artifact/
          if-no-files-found: error
          retention-days: 1
