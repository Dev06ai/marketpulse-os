name: NOVA 0.1.1 isolated build

on:
  push:
    branches:
      - nova-build-0.1.1
    paths:
      - 'nova-build/overlay/**'
      - '.github/workflows/nova-build-0.1.1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout isolated compiler branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned Android 35 toolchain
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
          test -f "$ANDROID_SDK_ROOT/platforms/android-35/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2"
          test -f "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar"

      - name: Export NOVA compiler toolchain
        shell: bash
        run: |
          rm -rf /tmp/nova-toolchain
          mkdir -p /tmp/nova-toolchain/platforms/android-35 /tmp/nova-toolchain/build-tools
          cp "$ANDROID_SDK_ROOT/platforms/android-35/android.jar" /tmp/nova-toolchain/platforms/android-35/android.jar
          cp -a "$ANDROID_SDK_ROOT/build-tools/35.0.0" /tmp/nova-toolchain/build-tools/35.0.0
          find /tmp/nova-toolchain -type f -exec sha256sum {} \; | sort > /tmp/nova-toolchain/TOOLCHAIN-SHA256SUMS.txt

      - name: Upload isolated compiler toolchain
        uses: actions/upload-artifact@v4
        with:
          name: nova-android35-compiler-toolchain
          path: /tmp/nova-toolchain/
          if-no-files-found: error
          retention-days: 1

      - name: Restore verified NOVA source
        shell: bash
        run: |
          rm -rf /tmp/nova-src /tmp/nova-artifact
          mkdir -p /tmp/nova-src /tmp/nova-artifact
          cat nova-build/chunks/00.b64 nova-build/chunks/01.b64 nova-build/chunks/02.b64 nova-build/chunks/03.b64 nova-build/chunks/04.b64 nova-build/chunks/05.b64 > /tmp/NOVA-base.b64
          base64 -d /tmp/NOVA-base.b64 > /tmp/NOVA-base.zip
          sha256sum /tmp/NOVA-base.zip
          unzip -oq /tmp/NOVA-base.zip -d /tmp/nova-src || true

          cat nova-build/overlay/00.b64 nova-build/overlay/01.b64 nova-build/overlay/02.b64 nova-build/overlay/03.b64 nova-build/overlay/04.b64 nova-build/overlay/05.b64 nova-build/overlay/06-08.b64 nova-build/overlay/09-11.b64 nova-build/overlay/12-14.b64 nova-build/overlay/15.b64 > /tmp/NOVA-overlay.b64
          base64 -d /tmp/NOVA-overlay.b64 > /tmp/NOVA-overlay.zip
          echo '8d8104459f223696519fa197a994ae5cafcd48bd01c11b179ddc8fb05d271172  /tmp/NOVA-overlay.zip' | sha256sum -c -
          unzip -tq /tmp/NOVA-overlay.zip
          unzip -oq /tmp/NOVA-overlay.zip -d /tmp/nova-src

          ROOT=/tmp/nova-src/NOVA-0.1.1
          test -f "$ROOT/tools/build.py"
          test -f "$ROOT/tests/security_manifest_test.py"
          test -f "$ROOT/tests/ui_policy_test.py"
          test -f "$ROOT/app/src/main/AndroidManifest.xml"
          test -f "$ROOT/app/src/main/java/dev/nova/companion/MainActivity.java"
          test -f "$ROOT/app/src/main/java/dev/nova/companion/PuppyView.java"
          test -f "$ROOT/app/src/main/java/dev/nova/companion/DevGuard.java"
          test -f "$ROOT/app/src/main/java/dev/nova/companion/CompanionService.java"
          ! find "$ROOT" -type f \( -name '*.jks' -o -name '*.keystore' -o -name 'password.txt' \) -print -quit | grep -q .

      - name: Run NOVA security and UI policy tests
        shell: bash
        run: |
          cd /tmp/nova-src/NOVA-0.1.1
          python3 tests/security_manifest_test.py
          python3 tests/ui_policy_test.py

      - name: Build unsigned aligned APK
        shell: bash
        env:
          NOVA_ANDROID_SDK: /usr/local/lib/android/sdk
        run: |
          cd /tmp/nova-src/NOVA-0.1.1
          python3 tools/build.py --unsigned
          test -f build/nova-unsigned.apk

      - name: Prepare local-signing bundle
        shell: bash
        run: |
          cp /tmp/nova-src/NOVA-0.1.1/build/nova-unsigned.apk /tmp/nova-artifact/NOVA-0.1.1-unsigned-aligned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar" /tmp/nova-artifact/apksigner.jar
          sha256sum /tmp/nova-artifact/* > /tmp/nova-artifact/SHA256SUMS.txt

      - name: Upload compiler output
        uses: actions/upload-artifact@v4
        with:
          name: nova-0.1.1-local-signing-bundle
          path: /tmp/nova-artifact/
          if-no-files-found: error
          retention-days: 1
