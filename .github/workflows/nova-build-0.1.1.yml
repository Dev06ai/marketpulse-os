name: NOVA 0.1.1 isolated build

on:
  push:
    branches:
      - nova-build-0.1.1
    paths:
      - 'nova-build/overrides/**'
      - '.github/workflows/nova-build-0.1.1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout isolated compiler branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned Android 35 toolchain
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
          test -f "$ANDROID_SDK_ROOT/platforms/android-35/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2"
          test -f "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar"

      - name: Recover intact NOVA checkpoint files
        shell: bash
        run: |
          rm -rf /tmp/nova-src /tmp/nova-artifact
          mkdir -p /tmp/nova-src /tmp/nova-artifact
          cat nova-build/chunks/00.b64 nova-build/chunks/01.b64 nova-build/chunks/02.b64 nova-build/chunks/03.b64 nova-build/chunks/04.b64 nova-build/chunks/05.b64 > /tmp/NOVA-source.b64
          base64 -d /tmp/NOVA-source.b64 > /tmp/NOVA-source.zip
          unzip -q /tmp/NOVA-source.zip -d /tmp/nova-src || true
          test -f /tmp/nova-src/NOVA-0.1.1/tools/build.py
          test -f /tmp/nova-src/NOVA-0.1.1/app/src/main/AndroidManifest.xml
          test -f /tmp/nova-src/NOVA-0.1.1/app/src/main/java/dev/nova/companion/PuppyView.java
          test -f /tmp/nova-src/NOVA-0.1.1/app/src/main/java/dev/nova/companion/CompanionService.java
          ! unzip -l /tmp/NOVA-source.zip | grep -Eqi '(\.jks|\.keystore|password\.txt|/signing/)'

      - name: Apply and verify final audited overrides
        shell: bash
        run: |
          MAIN=/tmp/nova-src/NOVA-0.1.1/app/src/main/java/dev/nova/companion/MainActivity.java
          GUARD=/tmp/nova-src/NOVA-0.1.1/app/src/main/java/dev/nova/companion/DevGuard.java
          cat nova-build/overrides/main/00.txt nova-build/overrides/main/01.txt nova-build/overrides/main/02.txt nova-build/overrides/main/03.txt nova-build/overrides/main/04.txt nova-build/overrides/main/05.txt nova-build/overrides/main/06.txt nova-build/overrides/main/07.txt nova-build/overrides/main/08.txt > "$MAIN"
          cat nova-build/overrides/guard/00.txt nova-build/overrides/guard/01.txt > "$GUARD"
          echo '321f7ebe6f933f734f21bded383a384f27a0b2ad575889b6a31db67a82a51882  '"$MAIN" | sha256sum -c -
          echo 'a265224cf5e00a5913df89db7aeb3e52782d2306f7901b8e203ea38ad88d5053  '"$GUARD" | sha256sum -c -
          grep -q 'Check for updates' "$MAIN"
          grep -q 'Security score' "$MAIN"
          grep -q 'Clear Nova cache' "$MAIN"
          ! grep -R -nE 'TextToSpeech|android.permission.INTERNET|marketpulse|dev trader|bitget' /tmp/nova-src/NOVA-0.1.1/app/src/main

      - name: Run NOVA security policy test
        shell: bash
        run: |
          cd /tmp/nova-src/NOVA-0.1.1
          python3 tests/security_manifest_test.py

      - name: Build unsigned aligned APK
        shell: bash
        env:
          NOVA_ANDROID_SDK: /usr/local/lib/android/sdk
        run: |
          cd /tmp/nova-src/NOVA-0.1.1
          python3 tools/build.py --unsigned
          test -f build/nova-unsigned.apk

      - name: Prepare local-signing bundle
        shell: bash
        run: |
          cp /tmp/nova-src/NOVA-0.1.1/build/nova-unsigned.apk /tmp/nova-artifact/NOVA-0.1.1-unsigned-aligned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar" /tmp/nova-artifact/apksigner.jar
          sha256sum /tmp/nova-artifact/* > /tmp/nova-artifact/SHA256SUMS.txt

      - name: Upload compiler output
        uses: actions/upload-artifact@v4
        with:
          name: nova-0.1.1-local-signing-bundle
          path: /tmp/nova-artifact/
          if-no-files-found: error
          retention-days: 1
