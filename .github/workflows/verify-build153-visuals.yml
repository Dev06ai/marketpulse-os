name: KYVORIQ Android layout verification
on:
  push:
    branches: ['feature/build153-refined-ui']
    paths: ['dev-trader/android/**', '.github/workflows/verify-build153-visuals.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile debug candidate and instrumented visual checks
        working-directory: dev-trader/android
        run: gradle assembleDebug assembleDebugAndroidTest -PdevTraderVersionCode=153 -PdevTraderVersionName=0.21.28 --stacktrace
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native layouts, interaction, motion and frame timing
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          script: |
            mkdir -p dist ui-check
            cp dev-trader/android/app/build/outputs/apk/debug/app-debug.apk dist/app-debug.apk
            adb install -r dist/app-debug.apk
            adb install -r dev-trader/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell wm size 720x1280
            adb shell wm density 320
            adb shell am instrument -e class com.devtrader.app.BrandVisualTest,com.devtrader.app.KyvoriqResponsiveLayoutTest -w com.devtrader.app.debug.test/androidx.test.runner.AndroidJUnitRunner > ui-check/instrumentation-compact.txt
            adb pull /sdcard/Android/data/com.devtrader.app.debug/files/build153 ui-check/compact-motion
            adb shell wm size 1080x2400
            adb shell wm density 420
            adb shell am instrument -e class com.devtrader.app.BrandVisualTest,com.devtrader.app.KyvoriqResponsiveLayoutTest -w com.devtrader.app.debug.test/androidx.test.runner.AndroidJUnitRunner > ui-check/instrumentation-normal.txt
            adb pull /sdcard/Android/data/com.devtrader.app.debug/files/build153 ui-check/normal-motion
            adb shell dumpsys gfxinfo com.devtrader.app.debug framestats > ui-check/gfxinfo.txt
            grep -q 'OK (' ui-check/instrumentation-compact.txt
            grep -q 'OK (' ui-check/instrumentation-normal.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build153-device-evidence
          path: |
            ui-check/
            dev-trader/android/app/build/outputs/apk/debug/
            dev-trader/android/app/build/reports/
          retention-days: 14

