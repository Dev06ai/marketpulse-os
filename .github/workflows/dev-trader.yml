# Build 131: secure Android owner pairing; no trading/backend behavior changes.
name: KYVORIQ CI

on:
  pull_request:
    branches: [dev-trader-v1]
    paths:
      - 'dev-trader/**'
      - '.github/workflows/dev-trader.yml'
  push:
    branches: [dev-trader-v1]
    paths:
      - 'dev-trader/**'
      - '.github/workflows/dev-trader.yml'
  workflow_dispatch:
    inputs:
      publish_android:
        description: 'Explicitly publish a KYVORIQ APK asset (PUBLIC when repository is public)'
        type: boolean
        required: true
        default: false

# Least privilege by default. Only the opt-in publish job can write releases.
permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require current-source and full-history secret checks
        run: python dev-trader/tools/security_scan.py --history
  native-host:
    name: Verified ZIP release gate
    # The existing Deplexo app uses an uploaded ZIP, not Git auto-deploy.
    # Restarting that app would rebuild the OLD ZIP, not this commit.
    needs: [security, backend, free-container]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package the tested source with its commit identity
        run: python dev-trader/tools/package_release.py --output release-artifacts/KYVORIQ-deplexo-backend.zip > release-artifacts-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: kyvoriq-deplexo-backend
          path: |
            release-artifacts/KYVORIQ-deplexo-backend.zip
            release-artifacts-manifest.json
          if-no-files-found: error
      - name: Record rollout requirement
        run: echo 'ZIP ready for the existing service. Follow dev-trader/SECURITY-ROLLOUT.md; no production deployment was performed by CI.'
  deploy-deplexo-existing:
    name: Existing Deplexo app rollout (explicit opt-in)
    # Auto deployments remain OFF unless the owner enables the GitHub variable.
    # Never deploy a PR/draft branch, and never create a replacement service.
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev-trader-v1' && vars.KYVORIQ_AUTODEPLOY_ENABLED == 'true'
    needs: [security, backend, free-container, android, native-host]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: kyvoriq-existing-deplexo-service
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: kyvoriq-deplexo-backend
          path: dist
      - name: Upload verified source and redeploy original service
        env:
          DEPLEXO_TOKEN: ${{ secrets.DEPLEXO_TOKEN }}
          DEPLEXO_APP_ID: ${{ secrets.DEPLEXO_APP_ID }}
        run: |
          python dev-trader/tools/deploy_existing_deplexo.py \
            --archive dist/release-artifacts/KYVORIQ-deplexo-backend.zip \
            --expected-commit "$GITHUB_SHA" \
            --deploy

  free-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the core build without Firebase
        working-directory: dev-trader/backend
        run: |
          pip install -r requirements-core.txt pytest httpx hypothesis==6.168.5
          pytest -q
          python tools/benchmark_free_host.py
      - name: Build and probe the constrained container
        run: |
          docker build -t dev-trader-free dev-trader/backend
          # Cold-start and invoke the compiled multi-agent graph under the free host limit.
          docker run --rm --memory=128m --cpus=.25 dev-trader-free python -c 'from app.decision_graph import review_decision; import time; now=int(time.time()*1000); market=dict(health="HEALTHY",connected=True,now_ms=now,market_update_ms=now,bid=99,ask=101,spread_bps=0.1); sig=dict(id="probe",direction="LONG",entry=100,stop=99,target2=103,rr=3,grade="A",evidence={}); out=review_decision(market,[sig],"probe"); assert out["action"]=="APPROVE",out; assert len(out["agents"])==4; print("LANGGRAPH_128MB_OK",out["duration_ms"])'
          # Ephemeral CI-only auth: never reuse or log a production credential.
          export KYVORIQ_API_OWNER_TOKEN="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          echo "::add-mask::$KYVORIQ_API_OWNER_TOKEN"
          export KYVORIQ_SMOKE_OWNER_TOKEN="$KYVORIQ_API_OWNER_TOKEN"
          docker volume create dev-trader-smoke-data
          docker run -d --name dev-trader-smoke --memory=128m --cpus=.25 \
            --read-only --tmpfs /tmp:rw,noexec,size=100m \
            -v dev-trader-smoke-data:/data -p 3000:3000 -e KYVORIQ_API_OWNER_TOKEN dev-trader-free
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null; then break; fi
            sleep 1
          done
          python dev-trader/backend/tools/smoke_host.py --url http://127.0.0.1:3000
          docker exec dev-trader-smoke python -c 'from pathlib import Path; p=Path("/data/smoke-persistence"); p.write_text("saved")'
          docker restart dev-trader-smoke
          docker exec dev-trader-smoke python -c 'from pathlib import Path; assert Path("/data/smoke-persistence").read_text()=="saved"'
          docker stats --no-stream dev-trader-smoke
          test "$(docker inspect -f '{{.State.OOMKilled}}' dev-trader-smoke)" = false
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs --tail 50 dev-trader-smoke || true
          docker rm -f dev-trader-smoke || true
          docker volume rm dev-trader-smoke-data || true
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev-trader/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest hypothesis==6.168.5
      - run: python -m py_compile app/*.py
      - run: pytest -q

  android:
    runs-on: ubuntu-latest
    outputs:
      android_changed: ${{ steps.changed.outputs.android_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect Android changes
        id: changed
        run: |
          if git diff --name-only HEAD^ HEAD | grep -q '^dev-trader/android/'; then
            echo "android_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "android_changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build Android debug APK
        working-directory: dev-trader/android
        run: gradle assembleDebug --stacktrace
      - name: Build signed Android release APK
        if: steps.changed.outputs.android_changed == 'true'
        working-directory: dev-trader/android
        env:
          DEV_TRADER_KEYSTORE_PATH: ${{ github.workspace }}/dev-trader-signing.jks
          DEV_TRADER_KEYSTORE_PASSWORD: ${{ secrets.DEV_TRADER_KEYSTORE_PASSWORD }}
          DEV_TRADER_KEY_ALIAS: ${{ secrets.DEV_TRADER_KEY_ALIAS }}
          DEV_TRADER_KEY_PASSWORD: ${{ secrets.DEV_TRADER_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.DEV_TRADER_KEYSTORE_BASE64 }}" | base64 --decode > "$DEV_TRADER_KEYSTORE_PATH"
          gradle assembleRelease --stacktrace
          if unzip -l app/build/outputs/apk/release/app-release.apk | grep -q ui_preview.json; then
            echo 'Debug preview data must never be included in release APKs.'
            exit 1
          fi
      - name: Stage Android artifacts
        if: steps.changed.outputs.android_changed == 'true'
        run: |
          mkdir -p release-artifacts
          cp dev-trader/android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/app-debug.apk
          cp dev-trader/android/app/build/outputs/apk/release/app-release.apk release-artifacts/app-release.apk
      - uses: actions/upload-artifact@v4
        if: steps.changed.outputs.android_changed == 'true'
        with:
          name: dev-trader-builds
          path: release-artifacts/
          if-no-files-found: error

  visual-check:
    needs: android
    if: needs.android.outputs.android_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: dev-trader-builds
          path: dist
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Retry transient Android 35 emulator image download failures
        run: |
          # Hosted runner already has command-line tools. Avoid
          # android-actions/setup-android, which tries to install the
          # removed legacy `tools` package and fails before testing.
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          for attempt in 1 2 3; do
            echo "Emulator image preparation attempt $attempt/3"
            if "$SDKMANAGER" --install 'system-images;android-35;google_apis;x86_64' --channel=0; then
              exit 0
            fi
            rm -rf "$SDK_ROOT/system-images/android-35/google_apis/x86_64"
            sleep $((attempt * 10))
          done
          exit 1
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash dev-trader/android/visual-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev-trader-ui-check
          path: ui-check/
          if-no-files-found: error

  publish-release:
    permissions:
      contents: write
    concurrency:
      group: dev-trader-release
      cancel-in-progress: false
    needs: [android, backend, visual-check, free-container, native-host, security]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev-trader-v1' && inputs.publish_android == true && needs.android.outputs.android_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dev-trader-builds
          path: dist
      - name: Prepare release
        id: release
        run: |
          mkdir -p release
          cp dist/app-release.apk release/app-release.apk
          sha256sum release/app-release.apk | awk '{print $1}' > release/app-release.sha256
          # Derive the tag/manifest version from the same Gradle defaults
          # used to build this APK. Refuse to overwrite a released version.
          python3 dev-trader/tools/android_release_version.py --github-output "$GITHUB_OUTPUT"
          echo "sha256=$(cat release/app-release.sha256)" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.release.outputs.tag }}" >/dev/null 2>&1; then
            echo "This release already exists; refusing to replace a published APK."
            exit 1
          fi
          gh release create "${{ steps.release.outputs.tag }}" release/app-release.apk --target "$GITHUB_SHA" --title "KYVORIQ ${{ steps.release.outputs.version_name }} (${{ steps.release.outputs.version_code }})" --notes "${{ steps.release.outputs.notes }}"
      - name: Publish verified update manifest
        env:
          SHA256: "${{ steps.release.outputs.sha256 }}"
          VERSION_CODE: "${{ steps.release.outputs.version_code }}"
          VERSION_NAME: "${{ steps.release.outputs.version_name }}"
          APK_URL: "${{ steps.release.outputs.apk_url }}"
          RELEASE_NOTES: "${{ steps.release.outputs.notes }}"
        run: |
          git fetch origin dev-trader-v1
          git reset --hard origin/dev-trader-v1
          SHA256="$SHA256" python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("dev-trader/update.json")
          data = json.loads(p.read_text())
          next_code = int(os.environ["VERSION_CODE"])
          if int(data.get("versionCode", 0)) >= next_code:
              raise SystemExit("Update manifest is already at or above this version")
          data.update({
              "enabled": True,
              "versionCode": next_code,
              "versionName": os.environ["VERSION_NAME"],
              "apkUrl": os.environ["APK_URL"],
              "sha256": os.environ["SHA256"],
              "notes": os.environ["RELEASE_NOTES"]
          })
          p.write_text(json.dumps(data, indent=2) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev-trader/update.json
          git commit -m "Publish KYVORIQ update manifest ${{ steps.release.outputs.tag }} [skip ci]" || exit 0
          git push origin dev-trader-v1
