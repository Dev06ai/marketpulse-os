# Build 130: optional TradingView chart preview; native chart remains primary.
name: KYVORIQ CI

on:
  pull_request:
    branches: [dev-trader-v1]
    paths:
      - 'dev-trader/**'
      - '.github/workflows/dev-trader.yml'
  push:
    branches: [dev-trader-v1]
    paths:
      - 'dev-trader/**'
      - '.github/workflows/dev-trader.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require current-source and full-history secret checks
        run: python dev-trader/tools/security_scan.py --history
  native-host:
    # Never restart the live Deplexo service while reviewing a PR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect backend execution changes
        id: backend_changed
        run: |
          if git diff --name-only HEAD^ HEAD | grep -q '^dev-trader/backend/'; then
            echo "backend_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend_changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Request Deplexo backend redeploy
        if: steps.backend_changed.outputs.backend_changed == 'true'
        env:
          DEPLEXO_TOKEN: ${{ secrets.DEPLEXO_TOKEN }}
          DEPLEXO_APP_ID: ${{ secrets.DEPLEXO_APP_ID }}
        run: |
          if [ -z "${DEPLEXO_TOKEN:-}" ]; then
            echo "DEPLEXO_TOKEN is not configured in repository secrets; relying on Deplexo git auto-deploy."
            exit 0
          fi
          APP_ID="${DEPLEXO_APP_ID:-}"
          if [ -z "$APP_ID" ]; then
            ME="$(curl -fsS --max-time 20 -H "Authorization: Bearer $DEPLEXO_TOKEN" https://deplexo.com/user/api/v1/me)"
            APP_ID="$(printf '%s' "$ME" | jq -r '.apps[]? | select(((.name // "") | ascii_downcase | contains("dev-trader"))) | .id' | head -n 1)"
          fi
          if [ -z "$APP_ID" ] || [ "$APP_ID" = "null" ]; then
            echo "Could not resolve the Deplexo app id. Set DEPLEXO_APP_ID in repository secrets."
            exit 1
          fi
          curl -fsS --max-time 30             -H "Authorization: Bearer $DEPLEXO_TOKEN"             -H 'Content-Type: application/json'             --data "{\"commitSha\":\"$GITHUB_SHA\"}"             "https://deplexo.com/user/api/v1/apps/$APP_ID/restart"
          echo
          echo "Deplexo rebuild requested for $GITHUB_SHA"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Verify live host after backend changes
        if: steps.backend_changed.outputs.backend_changed == 'true'
        run: |
          ok=false
          for attempt in {1..4}; do
            echo "Strict host probe attempt $attempt/4"
            if gradle -p dev-trader/tools/host-probe run --args='https://dev-trader-engine.de.deplexo.com' --stacktrace; then
              ok=true
              break
            fi
            if [ "$attempt" -lt 4 ]; then
              sleep $((attempt * 10))
            fi
          done
          test "$ok" = "true"
      - name: Report live host health for client-only changes
        if: steps.backend_changed.outputs.backend_changed != 'true'
        continue-on-error: true
        run: |
          gradle -p dev-trader/tools/host-probe run --args='https://dev-trader-engine.de.deplexo.com' --stacktrace
      - name: Wait for audited Deplexo decision-engine backend v3.8
        if: steps.backend_changed.outputs.backend_changed == 'true'
        run: |
          ok=false
          for attempt in {1..42}; do
            BOOTSTRAP="$(curl -fsS --max-time 12 'https://dev-trader-engine.de.deplexo.com/bootstrap?profile=dashboard' 2>/dev/null || true)"
            POLICY="$(printf '%s' "$BOOTSTRAP" | jq -r '.execution.summary.execution_policy // "UNKNOWN"' 2>/dev/null || echo UNKNOWN)"
            REVISION="$(printf '%s' "$BOOTSTRAP" | jq -r '.engine.engine_revision // .engine_revision // "UNKNOWN"' 2>/dev/null || echo UNKNOWN)"
            PACK="$(curl -fsS --max-time 12 'https://dev-trader-engine.de.deplexo.com/level-pack' 2>/dev/null || true)"
            PACK_OK="$(printf '%s' "$PACK" | jq -r '(.pack_id == "dewald_levels_2026_10_07") and (.enabled == true)' 2>/dev/null || echo false)"
            echo "Deplexo check $attempt/42 • revision=$REVISION • policy=$POLICY • reaction_pack=$PACK_OK"
            if [ "$REVISION" = "market-decision-v3.8" ] &&                [ "$POLICY" = "CONFIDENCE_MARGIN_20X_FEE_ADJUSTED" ] &&                [ "$PACK_OK" = "true" ]; then
              ok=true
              break
            fi
            sleep 10
          done
          test "$ok" = "true"
  free-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the core build without Firebase
        working-directory: dev-trader/backend
        run: |
          pip install -r requirements-core.txt pytest httpx
          pytest -q
          python tools/benchmark_free_host.py
      - name: Build and probe the constrained container
        run: |
          docker build -t dev-trader-free dev-trader/backend
          # Cold-start and invoke the compiled multi-agent graph under the free host limit.
          docker run --rm --memory=128m --cpus=.25 dev-trader-free python -c 'from app.decision_graph import review_decision; import time; now=int(time.time()*1000); market=dict(health="HEALTHY",connected=True,now_ms=now,market_update_ms=now,bid=99,ask=101,spread_bps=0.1); sig=dict(id="probe",direction="LONG",entry=100,stop=99,target2=103,rr=3,grade="A",evidence={}); out=review_decision(market,[sig],"probe"); assert out["action"]=="APPROVE",out; assert len(out["agents"])==4; print("LANGGRAPH_128MB_OK",out["duration_ms"])'
          docker volume create dev-trader-smoke-data
          docker run -d --name dev-trader-smoke --memory=128m --cpus=.25 \
            --read-only --tmpfs /tmp:rw,noexec,size=100m \
            -v dev-trader-smoke-data:/data -p 3000:3000 dev-trader-free
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null; then break; fi
            sleep 1
          done
          python dev-trader/backend/tools/smoke_host.py --url http://127.0.0.1:3000
          docker exec dev-trader-smoke python -c 'from pathlib import Path; p=Path("/data/smoke-persistence"); p.write_text("saved")'
          docker restart dev-trader-smoke
          docker exec dev-trader-smoke python -c 'from pathlib import Path; assert Path("/data/smoke-persistence").read_text()=="saved"'
          docker stats --no-stream dev-trader-smoke
          test "$(docker inspect -f '{{.State.OOMKilled}}' dev-trader-smoke)" = false
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs --tail 50 dev-trader-smoke || true
          docker rm -f dev-trader-smoke || true
          docker volume rm dev-trader-smoke-data || true
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev-trader/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: python -m py_compile app/*.py
      - run: pytest -q
      - name: Package verified Deplexo backend
        run: |
          rm -rf deplexo-package KYVORIQ-deplexo-backend.zip
          mkdir -p deplexo-package
          # Deplexo validates deplexo.yaml against a schema that does not
          # accept the old framework: dockerfile field. Let it detect the
          # top-level Dockerfile instead, as its ZIP upload UI recommends.
          cp -R app knowledge Dockerfile requirements-core.txt requirements.txt .dockerignore .env.example deplexo-package/
          find deplexo-package -type d -name __pycache__ -prune -exec rm -rf {} +
          find deplexo-package -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          (cd deplexo-package && zip -qr ../KYVORIQ-deplexo-backend.zip .)
          # Prevent a future broken manifest or nested-root ZIP release.
          python -c 'import zipfile; z=zipfile.ZipFile("KYVORIQ-deplexo-backend.zip"); names=set(z.namelist()); assert "Dockerfile" in names and "app/main.py" in names; assert "deplexo.yaml" not in names; assert z.testzip() is None'
      - uses: actions/upload-artifact@v4
        with:
          name: kyvoriq-deplexo-backend
          path: dev-trader/backend/KYVORIQ-deplexo-backend.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    outputs:
      android_changed: ${{ steps.changed.outputs.android_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect Android changes
        id: changed
        run: |
          if git diff --name-only HEAD^ HEAD | grep -q '^dev-trader/android/'; then
            echo "android_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "android_changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build Android debug APK
        working-directory: dev-trader/android
        run: gradle assembleDebug --stacktrace -PdevTraderVersionCode=130 -PdevTraderVersionName=0.21.5
      - name: Build signed Android release APK
        if: steps.changed.outputs.android_changed == 'true'
        working-directory: dev-trader/android
        env:
          DEV_TRADER_KEYSTORE_PATH: ${{ github.workspace }}/dev-trader-signing.jks
          DEV_TRADER_KEYSTORE_PASSWORD: ${{ secrets.DEV_TRADER_KEYSTORE_PASSWORD }}
          DEV_TRADER_KEY_ALIAS: ${{ secrets.DEV_TRADER_KEY_ALIAS }}
          DEV_TRADER_KEY_PASSWORD: ${{ secrets.DEV_TRADER_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.DEV_TRADER_KEYSTORE_BASE64 }}" | base64 --decode > "$DEV_TRADER_KEYSTORE_PATH"
          gradle assembleRelease --stacktrace -PdevTraderVersionCode=130 -PdevTraderVersionName=0.21.5
          if unzip -l app/build/outputs/apk/release/app-release.apk | grep -q ui_preview.json; then
            echo 'Debug preview data must never be included in release APKs.'
            exit 1
          fi
      - name: Stage Android artifacts
        if: steps.changed.outputs.android_changed == 'true'
        run: |
          mkdir -p release-artifacts
          cp dev-trader/android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/app-debug.apk
          cp dev-trader/android/app/build/outputs/apk/release/app-release.apk release-artifacts/app-release.apk
      - uses: actions/upload-artifact@v4
        if: steps.changed.outputs.android_changed == 'true'
        with:
          name: dev-trader-builds
          path: release-artifacts/
          if-no-files-found: error

  visual-check:
    needs: android
    if: needs.android.outputs.android_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: dev-trader-builds
          path: dist
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash dev-trader/android/visual-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev-trader-ui-check
          path: ui-check/
          if-no-files-found: error

  publish-release:
    permissions:
      contents: write
    concurrency:
      group: dev-trader-release
      cancel-in-progress: false
    needs: [android, backend, visual-check, free-container, native-host, security]
    if: github.event_name != 'pull_request' && needs.android.outputs.android_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dev-trader-builds
          path: dist
      - name: Prepare release
        id: release
        run: |
          mkdir -p release
          cp dist/app-release.apk release/app-release.apk
          sha256sum release/app-release.apk | awk '{print $1}' > release/app-release.sha256
          echo "tag=dev-trader-v0.21.5-130" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cat release/app-release.sha256)" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.release.outputs.tag }}" >/dev/null 2>&1; then
            echo "This release already exists; refusing to replace a published APK."
            exit 1
          fi
          gh release create "${{ steps.release.outputs.tag }}" release/app-release.apk --target "$GITHUB_SHA" --title "KYVORIQ 0.21.5 (130)" --notes "Optional pinned TradingView Lightweight Charts v5.2.1 preview with visible attribution; existing native 1h chart, SFP/OB overlays and gestures remain default. Demo trading safety unchanged."
      - name: Publish verified update manifest
        env:
          SHA256: "${{ steps.release.outputs.sha256 }}"
        run: |
          git fetch origin dev-trader-v1
          git reset --hard origin/dev-trader-v1
          SHA256="$SHA256" python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("dev-trader/update.json")
          data = json.loads(p.read_text())
          data.update({
              "enabled": True,
              "versionCode": 130,
              "versionName": "0.21.5",
              "apkUrl": "https://github.com/Dev06ai/marketpulse-os/releases/download/dev-trader-v0.21.5-130/app-release.apk",
              "sha256": os.environ["SHA256"],
              "notes": "KYVORIQ 0.21.5 • optional TradingView Lightweight Charts preview • native chart default • demo safety unchanged"
          })
          p.write_text(json.dumps(data, indent=2) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev-trader/update.json
          git commit -m "Publish KYVORIQ update manifest ${{ steps.release.outputs.tag }} [skip ci]" || exit 0
          git push origin dev-trader-v1
