name: Dev Trader CI

on:
  push:
    branches: [dev-trader-v1]
    paths:
      - 'dev-trader/**'
      - '.github/workflows/dev-trader.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev-trader/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: python -m py_compile app/*.py
      - run: pytest -q

  android:
    runs-on: ubuntu-latest
    outputs:
      android_changed: ${{ steps.changed.outputs.android_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect Android changes
        id: changed
        run: |
          if git diff --name-only HEAD^ HEAD | grep -q '^dev-trader/android/'; then
            echo "android_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "android_changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build Android debug APK
        working-directory: dev-trader/android
        run: gradle assembleDebug --stacktrace -PdevTraderVersionCode=96 -PdevTraderVersionName=0.12.0
      - name: Build signed Android release APK
        if: steps.changed.outputs.android_changed == 'true'
        working-directory: dev-trader/android
        env:
          DEV_TRADER_KEYSTORE_PATH: ${{ github.workspace }}/dev-trader-signing.jks
          DEV_TRADER_KEYSTORE_PASSWORD: ${{ secrets.DEV_TRADER_KEYSTORE_PASSWORD }}
          DEV_TRADER_KEY_ALIAS: ${{ secrets.DEV_TRADER_KEY_ALIAS }}
          DEV_TRADER_KEY_PASSWORD: ${{ secrets.DEV_TRADER_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.DEV_TRADER_KEYSTORE_BASE64 }}" | base64 --decode > "$DEV_TRADER_KEYSTORE_PATH"
          gradle assembleRelease --stacktrace -PdevTraderVersionCode=96 -PdevTraderVersionName=0.12.0
          if unzip -l app/build/outputs/apk/release/app-release.apk | grep -q ui_preview.json; then
            echo 'Debug preview data must never be included in release APKs.'
            exit 1
          fi
      - name: Stage Android artifacts
        if: steps.changed.outputs.android_changed == 'true'
        run: |
          mkdir -p release-artifacts
          cp dev-trader/android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/app-debug.apk
          cp dev-trader/android/app/build/outputs/apk/release/app-release.apk release-artifacts/app-release.apk
      - uses: actions/upload-artifact@v4
        if: steps.changed.outputs.android_changed == 'true'
        with:
          name: dev-trader-builds
          path: release-artifacts/
          if-no-files-found: error

  visual-check:
    needs: android
    if: needs.android.outputs.android_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: dev-trader-builds
          path: dist
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash dev-trader/android/visual-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev-trader-ui-check
          path: ui-check/
          if-no-files-found: error

  publish-release:
    concurrency:
      group: dev-trader-release
      cancel-in-progress: false
    needs: [android, backend, visual-check]
    if: needs.android.outputs.android_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dev-trader-builds
          path: dist
      - name: Prepare release
        id: release
        run: |
          mkdir -p release
          cp dist/app-release.apk release/app-release.apk
          sha256sum release/app-release.apk | awk '{print $1}' > release/app-release.sha256
          echo "tag=dev-trader-v0.12.0-96" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cat release/app-release.sha256)" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${{ steps.release.outputs.tag }}" --yes --cleanup-tag || true
          gh release create "${{ steps.release.outputs.tag }}" release/app-release.apk --title "Dev Trader 0.12.0 (96)" --notes "Trade, Positions and Insights workspaces; verified exchange fill accounting; fee-aware execution and drawdown controls. Backend regression tests and six native emulator layouts must pass before publication."
      - name: Publish verified update manifest
        env:
          SHA256: "${{ steps.release.outputs.sha256 }}"
        run: |
          git fetch origin dev-trader-v1
          git reset --hard origin/dev-trader-v1
          SHA256="$SHA256" python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("dev-trader/update.json")
          data = json.loads(p.read_text())
          data.update({
              "enabled": True,
              "versionCode": 96,
              "versionName": "0.12.0",
              "apkUrl": "https://github.com/Dev06ai/marketpulse-os/releases/download/dev-trader-v0.12.0-96/app-release.apk",
              "sha256": os.environ["SHA256"],
              "notes": "Dev Trader 0.12.0 • Trade / Positions / Insights • exchange fill ledger • stronger execution checks"
          })
          p.write_text(json.dumps(data, indent=2) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev-trader/update.json
          git commit -m "Publish Dev Trader self-update manifest dev-trader-release-0.12.0-96 [skip ci]" || exit 0
          git push origin dev-trader-v1
