name: KYVORIQ 159 chart and account verification
on:
  push:
    branches: [ui/chart-hero-159]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Provision existing release signing key
        env:
          KEYSTORE_B64: ${{ secrets.DEV_TRADER_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "${KEYSTORE_B64:-}"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/kyvoriq-signing.jks"
      - name: Build signed update and offline instrumented preview
        working-directory: dev-trader/android
        env:
          DEV_TRADER_KEYSTORE_PATH: ${{ runner.temp }}/kyvoriq-signing.jks
          DEV_TRADER_KEYSTORE_PASSWORD: ${{ secrets.DEV_TRADER_KEYSTORE_PASSWORD }}
          DEV_TRADER_KEY_ALIAS: ${{ secrets.DEV_TRADER_KEY_ALIAS }}
          DEV_TRADER_KEY_PASSWORD: ${{ secrets.DEV_TRADER_KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Verify update signing continuity and APK contents
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --max-time 90 -o "$RUNNER_TEMP/previous.apk" \
            'https://github.com/Dev06ai/marketpulse-os/releases/download/dev-trader-v0.21.32-157/app-release.apk'
          SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$SIGNER" verify --print-certs "$RUNNER_TEMP/previous.apk" > "$RUNNER_TEMP/old-certs"
          "$SIGNER" verify --print-certs dev-trader/android/app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/new-certs"
          python - <<'PY'
          from pathlib import Path
          import os,re
          def cert(name):
              data=(Path(os.environ['RUNNER_TEMP'])/name).read_text()
              hashes=re.findall(r'certificate SHA-256 digest:\s*([0-9a-fA-F]{64})',data)
              assert hashes, f'No signer certificate in {name}'
              return hashes[0].lower()
          assert cert('old-certs') == cert('new-certs'), 'Signing certificate mismatch'
          print('Signing continuity verified:',cert('new-certs'))
          PY
          ! unzip -l dev-trader/android/app/build/outputs/apk/release/app-release.apk | grep -Eqi 'ui_preview\.json|\.env$|\.jks$'
          mkdir -p release preview
          cp dev-trader/android/app/build/outputs/apk/release/app-release.apk release/KYVORIQ-0.21.34-Build159-signed.apk
          cp dev-trader/android/app/build/outputs/bundle/release/app-release.aab release/KYVORIQ-0.21.34-Build159-signed.aab
          sha256sum release/* > release/SHA256SUMS.txt
          cp dev-trader/android/app/build/outputs/apk/debug/app-debug.apk preview/
          cp dev-trader/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk preview/
      - uses: actions/upload-artifact@v4
        with:
          name: KYVORIQ-159-signed
          path: release/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: KYVORIQ-159-preview
          path: preview/
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/kyvoriq-signing.jks"
  visual:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: KYVORIQ-159-preview
          path: preview
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash dev-trader/android/verify-hero-159.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KYVORIQ-159-visual-verification
          path: ui-159/
          if-no-files-found: error
