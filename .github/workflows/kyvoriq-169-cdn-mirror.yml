name: Mirror checksum-verified KYVORIQ 169 APK on alternate CDN
on:
  push:
    branches: [ci/kyvoriq-169-cdn-mirror-20261014]
    paths: [.github/workflows/kyvoriq-169-cdn-mirror.yml]
permissions:
  contents: write
concurrency:
  group: kyvoriq-verified-apk-cdn
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: dev-trader-v0.21.44-169
      EXPECTED_SHA256: a3206d936e99189ab63c57aafa4a0d327a00d9d5518edeb04a3459b3a956a7b3
      DEST_BRANCH: kyvoriq-apk-delivery
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kyvoriq-apk-delivery
          persist-credentials: true
      - name: Retrieve and verify immutable signed published APK
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .draft)" = false
          mkdir -p "$RUNNER_TEMP/kyvoriq-release"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern app-release.apk --dir "$RUNNER_TEMP/kyvoriq-release"
          echo "$EXPECTED_SHA256  $RUNNER_TEMP/kyvoriq-release/app-release.apk" | sha256sum --check
          test "$(stat -c%s "$RUNNER_TEMP/kyvoriq-release/app-release.apk")" = "5683325"
          unzip -tq "$RUNNER_TEMP/kyvoriq-release/app-release.apk" | grep -Fq 'No errors detected'
          mkdir -p downloads
          cp "$RUNNER_TEMP/kyvoriq-release/app-release.apk" downloads/KYVORIQ-169.apk
          echo "$EXPECTED_SHA256  downloads/KYVORIQ-169.apk" | sha256sum --check
      - name: Publish immutable APK mirror without touching signed release or OTA manifest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/KYVORIQ-169.apk
          git diff --cached --quiet && { echo 'Verified mirror already present'; exit 0; }
          git commit -m "Mirror immutable signed KYVORIQ Build 169 APK for CDN delivery"
          git push origin HEAD:refs/heads/kyvoriq-apk-delivery
          echo "KYVORIQ_169_CDN_MIRROR_PUBLISHED"
