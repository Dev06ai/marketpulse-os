name: KYVORIQ 158 signed candidate verification (never publishes)
on:
  pull_request:
    branches: [dev-trader-v1]
    paths:
      - 'dev-trader/android/**'
      - '.github/workflows/verify-consumer-signed-158.yml'
permissions:
  contents: read
jobs:
  signed-candidate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Provision existing release keystore from GitHub secrets (never print)
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.DEV_TRADER_KEYSTORE_BASE64 }}
          DEV_TRADER_KEYSTORE_PASSWORD: ${{ secrets.DEV_TRADER_KEYSTORE_PASSWORD }}
          DEV_TRADER_KEY_ALIAS: ${{ secrets.DEV_TRADER_KEY_ALIAS }}
          DEV_TRADER_KEY_PASSWORD: ${{ secrets.DEV_TRADER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "${KEYSTORE_B64:-}" || -z "${DEV_TRADER_KEYSTORE_PASSWORD:-}" ||
                -z "${DEV_TRADER_KEY_ALIAS:-}" || -z "${DEV_TRADER_KEY_PASSWORD:-}" ]]; then
            echo "Existing Android release signing secrets are unavailable. No signed candidate is produced."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/kyvoriq-release-signing.jks"
          test -s "$GITHUB_WORKSPACE/kyvoriq-release-signing.jks"
      - name: Build version 158 signed APK and AAB
        working-directory: dev-trader/android
        env:
          DEV_TRADER_KEYSTORE_PATH: ${{ github.workspace }}/kyvoriq-release-signing.jks
          DEV_TRADER_KEYSTORE_PASSWORD: ${{ secrets.DEV_TRADER_KEYSTORE_PASSWORD }}
          DEV_TRADER_KEY_ALIAS: ${{ secrets.DEV_TRADER_KEY_ALIAS }}
          DEV_TRADER_KEY_PASSWORD: ${{ secrets.DEV_TRADER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle assembleRelease bundleRelease --stacktrace \
            -PdevTraderVersionCode=158 -PdevTraderVersionName=0.21.33
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          ! unzip -l app/build/outputs/apk/release/app-release.apk | grep -Eqi 'ui_preview\.json|\.env$|\.jks$'
      - name: Verify installable APK signature continuity against published Build 157
        shell: bash
        run: |
          set -euo pipefail
          PREVIOUS="$RUNNER_TEMP/previous-157.apk"
          curl --fail --location --silent --show-error --retry 3 --max-time 90 \
            -o "$PREVIOUS" \
            'https://github.com/Dev06ai/marketpulse-os/releases/download/dev-trader-v0.21.32-157/app-release.apk'
          test -s "$PREVIOUS"
          APK=dev-trader/android/app/build/outputs/apk/release/app-release.apk
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$SIGNER"
          "$SIGNER" verify --print-certs "$PREVIOUS" > "$RUNNER_TEMP/old-certs"
          "$SIGNER" verify --print-certs "$APK" > "$RUNNER_TEMP/new-certs"
          OLD="$(grep -m1 'Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/old-certs" | cut -d: -f2- | tr -d '[:space:]')"
          NEW="$(grep -m1 'Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/new-certs" | cut -d: -f2- | tr -d '[:space:]')"
          if [[ -z "$OLD" || "$OLD" != "$NEW" ]]; then
            echo "Signing certificate mismatch or unknown. Refusing to distribute as an update."
            exit 1
          fi
          echo "SIGNED_CERTIFICATE_CONTINUITY_VERIFIED"
      - name: Package privately verified candidate artifacts
        run: |
          set -euo pipefail
          mkdir -p candidate
          cp dev-trader/android/app/build/outputs/apk/release/app-release.apk candidate/KYVORIQ-0.21.33-158-signed-candidate.apk
          cp dev-trader/android/app/build/outputs/bundle/release/app-release.aab candidate/KYVORIQ-0.21.33-158-signed-candidate.aab
          sha256sum candidate/* > candidate/SHA256SUMS.txt
          printf 'TEST CANDIDATE ONLY — backend consumer subscriptions, billing, data lifecycle and MFA are NOT deployed. Do not publish or self-update.\n' > candidate/NOT_FOR_CONSUMER_ROLLOUT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KYVORIQ-158-SIGNED-VALIDATION-ONLY
          path: candidate/
          retention-days: 7
          if-no-files-found: error
      - name: Remove temporary signing keystore
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/kyvoriq-release-signing.jks"
