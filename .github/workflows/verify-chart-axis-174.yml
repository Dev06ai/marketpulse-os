name: KYVORIQ 175 true-price axis labels Android regression
on:
  push:
    branches:
      - fix/kyvoriq-175-trueprice-labels-20261014
    paths:
      - .github/workflows/verify-chart-axis-174.yml
      - dev-trader/android/app/src/main/java/com/devtrader/app/MarketChartView.kt
      - dev-trader/android/app/src/androidTest/java/com/devtrader/app/ChartAxisRailTest.kt
permissions:
  contents: read
jobs:
  chart-axis-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile actual Android chart and axis instrumentation
        working-directory: dev-trader/android
        run: |
          set -euo pipefail
          gradle assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Configure emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test actual Android Canvas price-rail layout on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -eu
            adb install -r dev-trader/android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r dev-trader/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class com.devtrader.app.ChartAxisRailTest com.devtrader.app.debug.test/androidx.test.runner.AndroidJUnitRunner | tee axis-qa.log
            grep -Eq 'OK \(4 tests\)' axis-qa.log
      - name: Upload assertion logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kyvoriq-axis-175-proof
          path: axis-qa.log
          if-no-files-found: ignore
          retention-days: 7
