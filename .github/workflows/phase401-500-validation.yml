name: Phase 401-500 Validation

on:
  push:
    paths:
      - 'phase401-500-apex-engine.js'
      - 'phase401-500-selftest.js'
      - 'validation-selftest.js'
      - 'phase-history.js'
      - 'server.js'
      - 'public/phase401-500-terminal.*'
      - 'public/apex-dashboard-v2.js'
      - 'public/apex-nexus-overhaul.js'
      - 'public/apex-nexus-overhaul.css'
      - 'public/index.html'
      - 'public/nexus-force-shell.js'
      - 'public/nexus-force-shell.css'
      - '.github/workflows/phase401-500-validation.yml'
      - 'package.json'
  pull_request:
    paths:
      - 'phase401-500-apex-engine.js'
      - 'phase401-500-selftest.js'
      - 'validation-selftest.js'
      - 'phase-history.js'
      - 'server.js'
      - 'public/phase401-500-terminal.*'
      - 'public/index.html'
      - 'public/apex-nexus-overhaul.css'
      - 'public/apex-nexus-overhaul.js'
      - 'public/apex-dashboard-v2.js'
      - 'package.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: node --check phase401-500-apex-engine.js
      - run: node --check phase401-500-selftest.js
      - run: node --check public/phase401-500-terminal.js
      - run: node --check public/apex-dashboard-v2.js
      - run: node --check public/apex-nexus-overhaul.js
      - run: node --check public/nexus-force-shell.js
      - run: node phase401-500-selftest.js
      - run: npm test
