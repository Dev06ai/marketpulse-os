name: Publish verified signed KYVORIQ 168 update
on:
  push:
    branches:
      - ci/kyvoriq-168-publish-signed-20261014
    paths:
      - .github/workflows/kyvoriq-168-publish-verified.yml
permissions:
  actions: read
  contents: write
concurrency:
  group: kyvoriq-168-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: dev-trader-v0.21.43-168
      TEST_RUN: "38553774786"
      ARTIFACT_ID: "11888787217"
      ARTIFACT_NAME: KYVORIQ-168-FIREBASE-TESTING-NOT-PUBLIC
      SOURCE_COMMIT: 3d9fe2cde2eb8d62db766db1939508a6dc10faf1
      EXPECTED_SIGNER: 17e4c550aa235dae926058654f203ecae9d7b30b432bde9dc2c358e28360cbab
    steps:
      - name: Confirm successful security, signed compilation and Android emulator checks
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TEST_RUN" --jq .conclusion)" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" --jq .expired)" = false
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" --jq .name)" = "$ARTIFACT_NAME"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release"
            exit 1
          fi
          mkdir -p payload
          gh run download "$TEST_RUN" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir payload
      - name: Verify signed owner-testing artifact and prevent entitlement change
        shell: bash
        run: |
          set -euo pipefail
          cd payload
          test -s KYVORIQ-0.21.43-168-FIREBASE-TEST.apk
          test -s KYVORIQ-0.21.43-168-FIREBASE-TEST.aab
          sha256sum --check SHA256SUMS.txt
          python3 - <<'PY'
          import json, os
          with open('TEST-SCOPE.json') as f: scope=json.load(f)
          assert scope['source_commit'] == os.environ['SOURCE_COMMIT']
          assert scope['offline_security_tests'] == 'passed'
          assert scope['offline_emulator_tests'] == 'passed'
          assert scope['consumer_api_configured'] is False
          assert scope['production_login_enabled'] is False
          assert scope['payments_enabled'] is False
          assert scope['update_manifest_modified'] is False
          print('Signed test scope validated; no premium/admin or trading access enabled.')
          PY
          APK=KYVORIQ-0.21.43-168-FIREBASE-TEST.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose "$APK" >/dev/null
          "$APKSIGNER" verify --print-certs "$APK" | grep -Fqi "$EXPECTED_SIGNER"
          "$AAPT" dump badging "$APK" | head -1 | grep -Fq "package: name='com.devtrader.app' versionCode='168' versionName='0.21.43'"
          ! unzip -Z1 "$APK" | grep -Ei '(^|/)(signing\.jks|\.env|google-services\.json)$'
          cp "$APK" app-release.apk
          echo "VERIFIED_APK_SHA256=$(sha256sum app-release.apk | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Publish signed 168 prerelease and verify downloaded SHA256
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_COMMIT" --prerelease \
            --title "KYVORIQ 0.21.43 — Build 168 icon visibility refresh" \
            --notes "Verified signed owner-testing Build 168. Restores legible Trade/Signals/Insights icons in separate layers above the liquid navigation highlight, refines selected-state contrast, enlarges the Signals hero symbol and makes Coming Soon compact. Keeps Build 167 OB filtering, responsive chart, unified login, and security protections. Consumer production roles, subscriptions, payment, and private trade execution remain separately server controlled. Real-phone visual confirmation remains pending." \
            payload/app-release.apk payload/KYVORIQ-0.21.43-168-FIREBASE-TEST.aab
          mkdir downloaded
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern app-release.apk --dir downloaded
          echo "$VERIFIED_APK_SHA256  downloaded/app-release.apk" | sha256sum --check
          echo "Verified immutable release asset SHA-256: $VERIFIED_APK_SHA256"
