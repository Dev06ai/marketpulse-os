name: Transcribe requested YouTube video audio

on:
  push:
    branches:
      - video-ingest-H97Q

permissions:
  contents: write

jobs:
  transcribe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq

      - name: Install transcription tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -q faster-whisper

      - name: Resolve public audio stream
        shell: bash
        run: |
          set -euo pipefail
          VIDEO_ID="H97QbGdCPa0"
          INSTANCES=(
            "https://pipedapi.kavin.rocks"
            "https://pipedapi.adminforge.de"
            "https://pipedapi.reallyaweso.me"
          )
          STREAM_URL=""
          for base in "${INSTANCES[@]}"; do
            echo "Trying $base"
            if curl -fsSL --retry 2 --connect-timeout 10 --max-time 30               "$base/streams/$VIDEO_ID" -o piped.json; then
              STREAM_URL="$(jq -r '
                if (.audioStreams // []) | length > 0
                then (.audioStreams | sort_by(.bitrate // 0) | last | .url)
                else empty end' piped.json)"
              if [ -n "${STREAM_URL:-}" ] && [ "$STREAM_URL" != "null" ]; then
                echo "Resolved audio stream"
                break
              fi
            fi
          done
          test -n "${STREAM_URL:-}"
          echo "$STREAM_URL" > audio_url.txt

      - name: Download audio and convert
        shell: bash
        run: |
          set -euo pipefail
          AUDIO_URL="$(cat audio_url.txt)"
          curl -L --retry 3 --connect-timeout 20 --max-time 900 "$AUDIO_URL" -o source_audio
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 source_audio
          ffmpeg -y -i source_audio -vn -ac 1 -ar 16000 marketpulse_video_audio.wav

      - name: Transcribe with Whisper
        run: |
          python - <<'PY'
          from faster_whisper import WhisperModel
          model = WhisperModel("small.en", device="cpu", compute_type="int8")
          segments, info = model.transcribe(
              "marketpulse_video_audio.wav",
              beam_size=5,
              vad_filter=True,
              condition_on_previous_text=True,
          )
          with open("marketpulse_video_transcript.md","w",encoding="utf-8") as f:
              f.write("# Video transcript: H97QbGdCPa0\n")
              f.write(f"Language: {info.language}\n")
              f.write(f"Duration: {info.duration:.1f}s\n\n")
              for seg in segments:
                  mins = int(seg.start//60)
                  secs = int(seg.start%60)
                  f.write(f"[{mins}:{secs:02d}] {seg.text.strip()}\n")
          PY
          test -s marketpulse_video_transcript.md

      - name: Commit transcript
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketpulse_video_transcript.md
          git commit -m "Transcribe requested YouTube video via public stream" || exit 0
          git push
