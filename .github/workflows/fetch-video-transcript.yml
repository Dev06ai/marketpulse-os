name: Fetch requested YouTube transcript

on:
  push:
    branches:
      - video-ingest-H97Q

permissions:
  contents: write

jobs:
  fetch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch transcript
        run: |
          set -euo pipefail
          curl -fsSL "https://youtube-transcript.ai/transcript/H97QbGdCPa0.txt" -o marketpulse_video_transcript.md
          test -s marketpulse_video_transcript.md
      - name: Commit transcript
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketpulse_video_transcript.md
          git commit -m "Ingest requested YouTube transcript" || exit 0
          git push
