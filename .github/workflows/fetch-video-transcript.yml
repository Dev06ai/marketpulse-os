name: Transcribe requested YouTube video audio

on:
  push:
    branches:
      - video-ingest-H97Q

permissions:
  contents: write

jobs:
  transcribe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq

      - name: Install transcription tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -q faster-whisper

      - name: Resolve public video/audio through Invidious
        shell: bash
        run: |
          set -euo pipefail
          VIDEO_ID="H97QbGdCPa0"
          INSTANCES=(
            "https://inv.nadeko.net"
            "https://invidious.nerdvpn.de"
            "https://yt.chocolatemoo53.com"
            "https://invidious.tiekoetter.com"
            "https://yewtu.be"
          )

          AUDIO_URL=""
          HLS_URL=""
          TITLE=""

          for base in "${INSTANCES[@]}"; do
            echo "Trying $base"
            rm -f info.json
            if curl -fsSL --retry 2 --connect-timeout 10 --max-time 45               "$base/api/v1/videos/$VIDEO_ID" -o info.json; then

              TITLE="$(jq -r '.title // empty' info.json)"
              AUDIO_URL="$(jq -r '
                (.adaptiveFormats // [])
                | map(select((.type // "") | startswith("audio/")))
                | map(select(.url != null and .url != ""))
                | sort_by((.bitrate // "0") | tonumber)
                | last
                | .url // empty' info.json)"

              HLS_URL="$(jq -r '.hlsUrl // empty' info.json)"

              if [ -n "${AUDIO_URL:-}" ]; then
                echo "Resolved direct audio stream from $base"
                break
              fi

              if [ -n "${HLS_URL:-}" ]; then
                echo "Resolved HLS stream from $base"
                break
              fi
            fi
          done

          printf '%s\n' "${TITLE:-Unknown}" > video_title.txt

          if [ -n "${AUDIO_URL:-}" ]; then
            printf '%s\n' "$AUDIO_URL" > audio_url.txt
            echo "DIRECT_AUDIO" > stream_mode.txt
          elif [ -n "${HLS_URL:-}" ]; then
            printf '%s\n' "$HLS_URL" > audio_url.txt
            echo "HLS" > stream_mode.txt
          else
            echo "No usable Invidious audio/HLS stream found"
            exit 1
          fi

      - name: Download and normalize audio
        shell: bash
        run: |
          set -euo pipefail
          MODE="$(cat stream_mode.txt)"
          URL="$(cat audio_url.txt)"

          if [ "$MODE" = "DIRECT_AUDIO" ]; then
            curl -L --retry 3 --connect-timeout 20 --max-time 3600 "$URL" -o source_audio
          else
            ffmpeg -nostdin -y -i "$URL" -t 5400 -vn -ac 1 -ar 16000 marketpulse_video_audio.wav
          fi

          if [ ! -s marketpulse_video_audio.wav ]; then
            ffmpeg -nostdin -y -i source_audio -vn -ac 1 -ar 16000 marketpulse_video_audio.wav
          fi

          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 marketpulse_video_audio.wav

      - name: Transcribe with Whisper
        run: |
          python - <<'PY'
          from faster_whisper import WhisperModel

          model = WhisperModel("small.en", device="cpu", compute_type="int8")
          segments, info = model.transcribe(
              "marketpulse_video_audio.wav",
              beam_size=5,
              vad_filter=True,
              condition_on_previous_text=True,
              word_timestamps=False,
          )

          title = open("video_title.txt", encoding="utf-8").read().strip()

          with open("marketpulse_video_transcript.md","w",encoding="utf-8") as f:
              f.write("# Video transcript: H97QbGdCPa0\n")
              f.write(f"Title: {title}\n")
              f.write(f"Language: {info.language}\n")
              f.write(f"Duration: {info.duration:.1f}s\n\n")

              for seg in segments:
                  mins = int(seg.start // 60)
                  secs = int(seg.start % 60)
                  f.write(f"[{mins}:{secs:02d}] {seg.text.strip()}\n")
          PY

          test -s marketpulse_video_transcript.md

      - name: Commit transcript
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketpulse_video_transcript.md
          git commit -m "Transcribe requested YouTube video through Invidious" || exit 0
          git push
