name: Publish verified KYVORIQ 164 to existing in-app update channel
on:
  push:
    branches:
      - ci/kyvoriq-164-promote-updater-20261014
    paths:
      - .github/workflows/kyvoriq-promote-164-existing-update-channel.yml
permissions:
  actions: read
  contents: write
concurrency:
  group: kyvoriq-existing-updater-release-164
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: dev-trader-v0.21.39-164
      TEST_RUN: "38537166281"
      TEST_ARTIFACT: KYVORIQ-164-FIREBASE-TESTING-NOT-PUBLIC
      APK_SHA256: f28040c95b7a18c86313a2e42edde806a9958438cb60db2cfd54afa565ecfe8e
      CERT_SHA256: 17e4c550aa235dae926058654f203ecae9d7b30b432bde9dc2c358e28360cbab
    steps:
      - name: Check completed signed test run and prevent release replacement
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TEST_RUN" --jq .conclusion)" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11881077518" --jq .expired)" = false
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Build 164 release already exists; refusing replacement."
            exit 1
          fi
          mkdir -p payload
          gh run download "$TEST_RUN" --repo "$GITHUB_REPOSITORY" --name "$TEST_ARTIFACT" --dir payload
      - name: Verify original package, release certificate, digest and restricted scope
        shell: bash
        run: |
          set -euo pipefail
          cd payload
          test -s KYVORIQ-0.21.39-164-FIREBASE-TEST.apk
          test -s KYVORIQ-0.21.39-164-FIREBASE-TEST.aab
          sha256sum --check SHA256SUMS.txt
          echo "$APK_SHA256  KYVORIQ-0.21.39-164-FIREBASE-TEST.apk" | sha256sum --check
          python3 - <<'PY'
          import json
          s=json.load(open("TEST-SCOPE.json"))
          assert s["source_commit"]=="b9974a780930bb9bea3f95248ffa4b514968288f"
          assert s["offline_security_tests"]=="passed"
          assert s["offline_emulator_tests"]=="passed"
          assert s["consumer_api_configured"] is False
          assert s["production_login_enabled"] is False
          assert s["payments_enabled"] is False
          print("Pinned signed testing candidate; protected features remain offline.")
          PY
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose KYVORIQ-0.21.39-164-FIREBASE-TEST.apk
          "$APKSIGNER" verify --print-certs KYVORIQ-0.21.39-164-FIREBASE-TEST.apk | grep -Fq "$CERT_SHA256"
          "$AAPT" dump badging KYVORIQ-0.21.39-164-FIREBASE-TEST.apk | head -1 | grep -Fq "package: name='com.devtrader.app' versionCode='164' versionName='0.21.39'"
          ! unzip -Z1 KYVORIQ-0.21.39-164-FIREBASE-TEST.apk | grep -Ei '(^|/)(signing\\.jks|\.env|google-services\\.json)$'
          cp KYVORIQ-0.21.39-164-FIREBASE-TEST.apk app-release.apk
      - name: Publish immutable prerelease asset for existing updater
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --target b9974a780930bb9bea3f95248ffa4b514968288f \
            --prerelease \
            --title "KYVORIQ 0.21.39 - Build 164 owner beta" \
            --notes "Signed owner testing update. Firebase Google, email verification and password recovery tested on device. Compact dialogs and public BTCUSDT SPOT view-only fallback (not a private perpetual feed). Consumer backend, premium plans, payments, private signals and execution are not enabled by this release. Private backend hosting remains unavailable." \
            payload/app-release.apk payload/KYVORIQ-0.21.39-164-FIREBASE-TEST.aab
          mkdir -p verified-release
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern app-release.apk --dir verified-release
          echo "$APK_SHA256  verified-release/app-release.apk" | sha256sum --check
      - name: Update existing KYVORIQ update feed ONLY after verified release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          payload={
            "enabled":True,
            "versionCode":164,
            "versionName":"0.21.39",
            "apkUrl":f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['RELEASE_TAG']}/app-release.apk",
            "sha256":os.environ["APK_SHA256"],
            "notes":"Build 164 owner testing prerelease. Signed Firebase identity, compact dialogs and clearly labeled public BTCUSDT spot fallback. Private trading server unavailable. No premium/admin/paid unlock."
          }
          with open("update-164.json","w") as f:
            json.dump(payload,f,indent=2);f.write("\\n")
          assert payload["versionCode"]==164
          PY
          MANIFEST_PATH="dev-trader/update.json"
          META="$(gh api "repos/$GITHUB_REPOSITORY/contents/$MANIFEST_PATH?ref=dev-trader-v1")"
          CONTENT_SHA="$(echo "$META" | jq -r .sha)"
          echo "$META" | jq -r .content | base64 --decode > old-manifest.json
          python3 - <<'PY'
          import json
          old=json.load(open("old-manifest.json"))
          assert old.get("versionCode",0) < 164, "Refusing downgrade/overwrite of newer feed"
          assert old["apkUrl"].startswith("https://github.com/Dev06ai/marketpulse-os/releases/download/")
          PY
          ENCODED="$(base64 -w0 update-164.json)"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$MANIFEST_PATH" \
            -f message="Offer signed KYVORIQ 164 on existing tester updater" \
            -f content="$ENCODED" -f branch=dev-trader-v1 -f sha="$CONTENT_SHA" > updated-manifest.json
          test "$(jq -r '.content.path' updated-manifest.json)" = "$MANIFEST_PATH"
          gh api "repos/$GITHUB_REPOSITORY/contents/$MANIFEST_PATH?ref=dev-trader-v1" \
            --jq '.content' | base64 --decode > confirmed-manifest.json
          python3 - <<'PY'
          import json,os
          m=json.load(open("confirmed-manifest.json"))
          assert m["versionCode"]==164 and m["versionName"]=="0.21.39"
          assert m["sha256"]==os.environ["APK_SHA256"]
          assert m["apkUrl"].endswith("/dev-trader-v0.21.39-164/app-release.apk")
          print("Existing in-app update button now advertises the verified signed 164 APK.")
          PY
