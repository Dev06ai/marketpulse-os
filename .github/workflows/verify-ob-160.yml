name: KYVORIQ 160 OB readable levels candidate
on:
  push:
    branches: [feature/build160-ob-zone-readability]
    paths:
      - 'dev-trader/android/**'
      - '.github/workflows/verify-ob-160.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Decode established release signing identity without printing keys
        env:
          KEYSTORE_B64: ${{ secrets.DEV_TRADER_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "${KEYSTORE_B64:-}"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/kyvoriq160.jks"
      - name: Compile signed APK/AAB and Android emulator tests
        working-directory: dev-trader/android
        env:
          DEV_TRADER_KEYSTORE_PATH: ${{ runner.temp }}/kyvoriq160.jks
          DEV_TRADER_KEYSTORE_PASSWORD: ${{ secrets.DEV_TRADER_KEYSTORE_PASSWORD }}
          DEV_TRADER_KEY_ALIAS: ${{ secrets.DEV_TRADER_KEY_ALIAS }}
          DEV_TRADER_KEY_PASSWORD: ${{ secrets.DEV_TRADER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle assembleRelease bundleRelease assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Confirm 160 package ID, signature identity, hashes and no secret assets
        run: |
          set -euo pipefail
          mkdir -p release preview
          cp dev-trader/android/app/build/outputs/apk/release/app-release.apk release/KYVORIQ-0.21.35-Build160.apk
          cp dev-trader/android/app/build/outputs/bundle/release/app-release.aab release/KYVORIQ-0.21.35-Build160.aab
          cp dev-trader/android/app/build/outputs/apk/debug/app-debug.apk preview/
          cp dev-trader/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk preview/
          curl -fsSL --retry 3 --max-time 100 -o "$RUNNER_TEMP/159.apk" 'https://github.com/Dev06ai/marketpulse-os/releases/download/dev-trader-v0.21.34-159/app-release.apk'
          SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$SIGNER" verify --print-certs "$RUNNER_TEMP/159.apk" > "$RUNNER_TEMP/159-certs"
          "$SIGNER" verify --print-certs release/KYVORIQ-0.21.35-Build160.apk > "$RUNNER_TEMP/160-certs"
          python - <<'PY'
          from pathlib import Path
          import os, re
          base=Path(os.environ["RUNNER_TEMP"])
          def cert(path):
              matches=re.findall(r'certificate SHA-256 digest:\s*([0-9a-fA-F]{64})', (base/path).read_text())
              assert matches, path
              return matches[0].lower()
          assert cert("159-certs")==cert("160-certs")=="17e4c550aa235dae926058654f203ecae9d7b30b432bde9dc2c358e28360cbab"
          print("BUILD159_TO_160_RELEASE_CERTIFICATE_VERIFIED")
          PY
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$AAPT" dump badging release/KYVORIQ-0.21.35-Build160.apk | head -n 1 | grep -E "^package: name='com.devtrader.app' versionCode='160' versionName='0.21.35'"
          ! unzip -Z1 release/KYVORIQ-0.21.35-Build160.apk | grep -Eqi 'ui_preview\.json|\.env$|\.jks$'
          sha256sum release/* | sed 's#  release/#  #' > release/SHA256SUMS.txt
          (cd release && sha256sum --check SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: KYVORIQ-160-SIGNED-TESTING-ONLY
          path: release/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: KYVORIQ-160-EMULATOR-PREVIEW
          path: preview/
          retention-days: 7
          if-no-files-found: error
      - name: Shred temporary private signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/kyvoriq160.jks"
  visual:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: KYVORIQ-160-EMULATOR-PREVIEW
          path: preview/
      - name: Permit emulator KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash dev-trader/android/verify-hero-159.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KYVORIQ-160-OB-VISUAL-PROOF
          path: ui-159/
          retention-days: 14
