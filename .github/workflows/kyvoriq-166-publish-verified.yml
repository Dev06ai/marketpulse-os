name: Publish verified KYVORIQ Build 166 testing prerelease
on:
  push:
    branches:
      - ci/kyvoriq-166-publish-verified-20261014
    paths:
      - .github/workflows/kyvoriq-166-publish-verified.yml
permissions:
  actions: read
  contents: write
concurrency:
  group: kyvoriq-release-166
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TEST_RUN: "38547761000"
      ARTIFACT_NAME: KYVORIQ-166-FIREBASE-TESTING-NOT-PUBLIC
      ARTIFACT_ID: "11886151505"
      SOURCE_COMMIT: 4a3b65b265ee9b43fdafb19985523b887a7ac6da
      RELEASE_TAG: dev-trader-v0.21.41-166
      EXPECTED_SHA256: 7dbbb86c86e2ddf4c3e904784a32ae265bfeace4c87c2978fa84d9909a6b51e5
      EXPECTED_SIGNER: 17e4c550aa235dae926058654f203ecae9d7b30b432bde9dc2c358e28360cbab
    steps:
      - name: Require successful pinned build and prohibit asset replacement
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TEST_RUN" --jq .conclusion)" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" --jq .expired)" = false
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing mutable replacement"
            exit 1
          fi
          mkdir -p payload
          gh run download "$TEST_RUN" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir payload
      - name: Verify exact APK/AAB and restricted test scope
        shell: bash
        run: |
          set -euo pipefail
          cd payload
          test -s KYVORIQ-0.21.41-166-FIREBASE-TEST.apk
          test -s KYVORIQ-0.21.41-166-FIREBASE-TEST.aab
          sha256sum --check SHA256SUMS.txt
          echo "$EXPECTED_SHA256  KYVORIQ-0.21.41-166-FIREBASE-TEST.apk" | sha256sum --check
          python3 - <<'PY'
          import json, os
          scope = json.load(open("TEST-SCOPE.json"))
          assert scope["source_commit"] == os.environ["SOURCE_COMMIT"]
          assert scope["offline_security_tests"] == "passed"
          assert scope["offline_emulator_tests"] == "passed"
          assert scope["consumer_api_configured"] is False
          assert scope["production_login_enabled"] is False
          assert scope["payments_enabled"] is False
          assert scope["update_manifest_modified"] is False
          print("Pinned artifact validated. Production roles, payments, private signals remain disabled.")
          PY
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose KYVORIQ-0.21.41-166-FIREBASE-TEST.apk
          "$APKSIGNER" verify --print-certs KYVORIQ-0.21.41-166-FIREBASE-TEST.apk | grep -Fq "$EXPECTED_SIGNER"
          "$AAPT" dump badging KYVORIQ-0.21.41-166-FIREBASE-TEST.apk | head -1 | grep -Fq "package: name='com.devtrader.app' versionCode='166' versionName='0.21.41'"
          ! unzip -Z1 KYVORIQ-0.21.41-166-FIREBASE-TEST.apk | grep -Ei '(^|/)(signing\\.jks|\\.env|google-services\\.json)$'
          cp KYVORIQ-0.21.41-166-FIREBASE-TEST.apk app-release.apk
      - name: Publish immutable Build 166 testing prerelease and verify remote asset
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_COMMIT" --prerelease \
            --title "KYVORIQ 0.21.41 — Build 166 UI and motion refresh" \
            --notes "Verified signed owner testing build. Unified dark-glass email/password login, in-place sign-up and password recovery, Google sign-in, new Trade/Signals/Insights icons, decorative Signals Coming Soon, smooth responsive native navigation and button motion. Reduced-motion preferences respected. Consumer/backend entitlements, subscriptions, payments, trading execution and admin authentication remain server-enforced/disabled. Real-phone fluidity has not yet been independently verified." \
            payload/app-release.apk payload/KYVORIQ-0.21.41-166-FIREBASE-TEST.aab
          mkdir -p downloaded
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern app-release.apk --dir downloaded
          echo "$EXPECTED_SHA256  downloaded/app-release.apk" | sha256sum --check
