name: KYVORIQ Firebase-connected 162 • signed testing candidate
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: "Reviewed 40-character source commit from the consumer rollout branch"
        type: string
        required: true
      firebase_project_id:
        description: "Existing authorized Firebase project ID; no credential values"
        type: string
        required: true
      firebase_android_app_id:
        description: "Firebase Android app ID for com.devtrader.app"
        type: string
        required: true
      google_web_client_id:
        description: "Google OAuth Web client ID for Firebase Auth"
        type: string
        required: true
      consumer_api_origin:
        description: "Independent HTTPS consumer API origin; blank produces an identity-only test build"
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      CONSUMER_API_ORIGIN: ${{ inputs.consumer_api_origin }}
      FIREBASE_PROJECT_ID: ${{ inputs.firebase_project_id }}
      FIREBASE_ANDROID_APP_ID: ${{ inputs.firebase_android_app_id }}
      GOOGLE_WEB_CLIENT_ID: ${{ inputs.google_web_client_id }}
    steps:
      - name: Require an immutable source revision
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          # Never run signing secrets against an arbitrary checkout.
          # This is the reviewed consumer-auth commit with 30 tests and five emulator layouts.
          [[ "$SOURCE_COMMIT" == "af72150a90b5a415b425521d61d1f8f3119ea680" ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consumer security tests before signing
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q -r dev-trader/consumer-api/requirements.txt
          python -m unittest discover -s dev-trader/consumer-api -p 'test_*.py' -v
      - name: Fail closed if Firebase/Google project registration is incomplete
        env:
          FIREBASE_API_KEY: ${{ secrets.KYVORIQ_FIREBASE_WEB_API_KEY }}
          KEYSTORE_B64: ${{ secrets.DEV_TRADER_KEYSTORE_BASE64 }}
          DEV_TRADER_KEYSTORE_PASSWORD: ${{ secrets.DEV_TRADER_KEYSTORE_PASSWORD }}
          DEV_TRADER_KEY_ALIAS: ${{ secrets.DEV_TRADER_KEY_ALIAS }}
          DEV_TRADER_KEY_PASSWORD: ${{ secrets.DEV_TRADER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re
          from urllib.parse import urlsplit
          project=os.environ.get('FIREBASE_PROJECT_ID','')
          app=os.environ.get('FIREBASE_ANDROID_APP_ID','')
          web=os.environ.get('GOOGLE_WEB_CLIENT_ID','')
          api=os.environ.get('FIREBASE_API_KEY','')
          origin=os.environ.get('CONSUMER_API_ORIGIN','')
          if origin:
              assert re.fullmatch(r'https://[A-Za-z0-9.-]+(?::[0-9]+)?/?', origin), 'Consumer API must be an HTTPS origin'
              host=urlsplit(origin).hostname
              assert host and '.' in host and host != 'localhost', 'Public consumer API hostname required'
              assert host != 'getvoroa.com' and not host.endswith('.getvoroa.com'), 'Private Voroa host forbidden'
              assert host not in {'dev-trader-engine.onrender.com', 'marketpulse-autotrader.onrender.com', 'marketpulse-os-d4p9.onrender.com'}, 'Private trading host forbidden'
          assert project == 'kyvoriq', 'Project ID must match the registered KYVORIQ Firebase project'
          assert re.fullmatch(r'1:[0-9]+:android:[A-Fa-f0-9]+(?:[A-Fa-f0-9:]*)?',app), 'Invalid Android Firebase app ID'
          assert re.fullmatch(r'[0-9]+-[a-zA-Z0-9_-]+\.apps\.googleusercontent\.com',web), 'Google OAuth Web client required'
          assert re.fullmatch(r'AIza[A-Za-z0-9_-]{30,}',api), 'Firebase Web API key not installed in GitHub secrets'
          assert os.environ.get('KEYSTORE_B64'), 'Release keystore missing'
          assert os.environ.get('DEV_TRADER_KEYSTORE_PASSWORD'), 'Release store password missing'
          assert os.environ.get('DEV_TRADER_KEY_ALIAS'), 'Release alias missing'
          assert os.environ.get('DEV_TRADER_KEY_PASSWORD'), 'Release key password missing'
          print('Firebase configuration shapes and existing release signing setup verified.')
          PY
      - name: Decode existing signed-update keystore privately
        env:
          KEYSTORE_B64: ${{ secrets.DEV_TRADER_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/kyvoriq-162.jks"
      - name: Build Firebase-connected signed APK/AAB WITHOUT enabling subscriptions
        working-directory: dev-trader/android
        env:
          DEV_TRADER_KEYSTORE_PATH: ${{ runner.temp }}/kyvoriq-162.jks
          DEV_TRADER_KEYSTORE_PASSWORD: ${{ secrets.DEV_TRADER_KEYSTORE_PASSWORD }}
          DEV_TRADER_KEY_ALIAS: ${{ secrets.DEV_TRADER_KEY_ALIAS }}
          DEV_TRADER_KEY_PASSWORD: ${{ secrets.DEV_TRADER_KEY_PASSWORD }}
          FIREBASE_API_KEY: ${{ secrets.KYVORIQ_FIREBASE_WEB_API_KEY }}
        run: |
          set -euo pipefail
          export ORG_GRADLE_PROJECT_kyvoriqFirebaseApiKey="$FIREBASE_API_KEY"
          export ORG_GRADLE_PROJECT_kyvoriqFirebaseAppId="$FIREBASE_ANDROID_APP_ID"
          export ORG_GRADLE_PROJECT_kyvoriqFirebaseProjectId="$FIREBASE_PROJECT_ID"
          export ORG_GRADLE_PROJECT_kyvoriqGoogleWebClientId="$GOOGLE_WEB_CLIENT_ID"
          export ORG_GRADLE_PROJECT_kyvoriqConsumerApiOrigin="$CONSUMER_API_ORIGIN"
          export ORG_GRADLE_PROJECT_devTraderVersionCode=162
          export ORG_GRADLE_PROJECT_devTraderVersionName=0.21.37
          gradle assembleRelease bundleRelease --no-daemon
      - name: Build offline emulator fixtures without provider configuration
        working-directory: dev-trader/android
        run: gradle assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Assert original signing identity, package, and no private assets
        run: |
          set -euo pipefail
          mkdir -p release
          cp dev-trader/android/app/build/outputs/apk/release/app-release.apk release/KYVORIQ-0.21.37-162-FIREBASE-TEST.apk
          cp dev-trader/android/app/build/outputs/bundle/release/app-release.aab release/KYVORIQ-0.21.37-162-FIREBASE-TEST.aab
          SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$SIGNER" verify --print-certs release/KYVORIQ-0.21.37-162-FIREBASE-TEST.apk > "$RUNNER_TEMP/cert-details"
          grep -Fq '17e4c550aa235dae926058654f203ecae9d7b30b432bde9dc2c358e28360cbab' "$RUNNER_TEMP/cert-details"
          grep -Fq '677b5a1f47c4da352e07a289c2e85dbe4a93d1e4' "$RUNNER_TEMP/cert-details"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$AAPT" dump badging release/KYVORIQ-0.21.37-162-FIREBASE-TEST.apk > "$RUNNER_TEMP/apk-badging"
          head -1 "$RUNNER_TEMP/apk-badging" | grep -E "^package: name='com.devtrader.app' versionCode='162' versionName='0.21.37'"
          unzip -tq release/KYVORIQ-0.21.37-162-FIREBASE-TEST.apk | grep -Fq 'No errors detected'
          unzip -Z1 release/KYVORIQ-0.21.37-162-FIREBASE-TEST.apk > "$RUNNER_TEMP/apk-files"
          ! grep -Ei 'google-services\.json|service.account|firebase.admin|\.jks$|\.env$' "$RUNNER_TEMP/apk-files"
          jarsigner -verify release/KYVORIQ-0.21.37-162-FIREBASE-TEST.aab > "$RUNNER_TEMP/aab-verification"
          grep -Fq 'jar verified.' "$RUNNER_TEMP/aab-verification"
          keytool -printcert -jarfile release/KYVORIQ-0.21.37-162-FIREBASE-TEST.aab > "$RUNNER_TEMP/aab-certificate"
          grep -Fq '17:E4:C5:50:AA:23:5D:AE:92:60:58:65:4F:20:3E:CA:E9:D7:B3:0B:43:2B:DE:9D:C2:C3:58:E2:83:60:CB:AB' "$RUNNER_TEMP/aab-certificate"
          (cd release && sha256sum KYVORIQ* > SHA256SUMS.txt)
          echo 'SIGNED_FIREBASE_CONFIGURED_CANDIDATE_CREATED_NOT_PUBLISHED'
      - name: Prepare offline emulator tests
        run: |
          mkdir -p preview
          cp dev-trader/android/app/build/outputs/apk/debug/app-debug.apk preview/
          cp dev-trader/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk preview/
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash dev-trader/android/verify-hero-159.sh
      - name: Record test scope without credentials
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('release/TEST-SCOPE.json').write_text(json.dumps({
              'source_commit': os.environ['SOURCE_COMMIT'],
              'consumer_api_configured': bool(os.environ['CONSUMER_API_ORIGIN']),
              'offline_security_tests': 'passed',
              'offline_emulator_tests': 'passed',
              'live_firebase_end_to_end': 'NOT_VERIFIED',
              'production_login_enabled': False,
              'payments_enabled': False,
              'update_manifest_modified': False,
          }, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KYVORIQ-162-OFFLINE-EMULATOR-PROOF
          path: ui-159/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: KYVORIQ-162-FIREBASE-TESTING-NOT-PUBLIC
          path: release/
          retention-days: 7
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/kyvoriq-162.jks"
