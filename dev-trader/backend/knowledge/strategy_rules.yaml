version: 1
mode: Klein-manual-only
risk:
  hard_cap_risk_pct: 1.0
  preferred_min_rr: 1.5
  elite_min_rr: 2.2
  dline_reference_min_rr: 1.5
  never_auto_execute: true
htf:
  weekly_open: true
  previous_week_high_low: true
  daily_swings: true
  avoid_midrange: false
sfp:
  enabled: true
  execution_timeframes: [15m, 5m]
  require_sweep: true
  require_close_back_inside: true
  invalidation_at_wick_extreme: true
mss:
  enabled: true
  require_body_close: true
  minimum_confirmed_candles: 8
  avoid_chasing_first_impulse: false
fvg:
  enabled: true
  entry_reference: 50_percent
  invalidation_on_close_through_reference: true
order_block:
  enabled: true
  require_structure_shift: false
  invalidation_on_structural_close: true
breaker:
  enabled: true
dline:
  enabled: true
  timeframes: [15m, 1h]
  preferred_touches: 2
  body_close_confirmation: true
  loose_scan: true
  trade_with_bigger_trend: true
  entries: [breakout, retest]
order_flow:
  cvd_from_taker_side: true
  oi_context: true
  orderbook_level1: true
signal_policy:
  stale_data_blocks_signal: true
  duplicate_signal_block: true
  manual_execution_only: true
  quality_governor:
    enabled: true
    max_signals_per_utc_day: 6
    cooldown_minutes_after_resolution: 45
    min_confidence: 0.70
    min_rr: 3.0
    require_grade_a: true
    require_1h_alignment: true
    require_4h_alignment: true
    require_structure_alignment: true
    minimum_extra_confirmations: 3
    block_high_vol: true
    block_range_non_sfp: true
    max_spread_bps: 4.0
    elliott_min_confidence: 0.60
    require_elliott_alignment_when_confident: true
    momentum_min_confidence: 0.82
    momentum_min_confirmations: 3
    decision_min_confidence: 0.78
    decision_min_confirmations: 3
    duplicate_setup_cooldown_minutes: 45

scan:
  mode: loose
  min_confidence: 0.44
  risk_atr_min: 0.08
  risk_atr_max: 3.0
