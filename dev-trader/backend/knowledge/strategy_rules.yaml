version: 1
mode: Klein-manual-only
risk:
  hard_cap_risk_pct: 1.0
  preferred_min_rr: 2.0
  elite_min_rr: 3.0
  dline_reference_min_rr: 2.0
  never_auto_execute: true
htf:
  weekly_open: true
  previous_week_high_low: true
  daily_swings: true
  avoid_midrange: false
sfp:
  enabled: true
  execution_timeframes: [15m, 5m]
  require_sweep: true
  require_close_back_inside: true
  invalidation_at_wick_extreme: true
mss:
  enabled: true
  require_body_close: true
  avoid_chasing_first_impulse: true
fvg:
  enabled: true
  entry_reference: 50_percent
  invalidation_on_close_through_reference: true
order_block:
  enabled: true
  require_structure_shift: true
  invalidation_on_structural_close: true
breaker:
  enabled: true
dline:
  enabled: true
  timeframes: [15m, 1h]
  preferred_touches: 3
  body_close_confirmation: true
  trade_with_bigger_trend: true
  entries: [breakout, retest]
order_flow:
  cvd_from_taker_side: true
  oi_context: true
  orderbook_level1: true
signal_policy:
  stale_data_blocks_signal: true
  duplicate_signal_block: true
  manual_execution_only: true
