version: 1
name: BTC advanced market-structure playbook
purpose: >
  Structured educational knowledge used as a decision-support layer. It does not
  guarantee profitable outcomes and must never override explicit invalidation,
  data-quality, or risk controls.

elliott_wave:
  fundamentals:
    - "Markets can be modeled as motive five-wave structures and corrective three-wave structures."
    - "Wave counts are fractal: a sequence at one degree can contain lower-degree sequences."
    - "Do not force a count when pivots are ambiguous; prefer no-count / alternate-count states."
  impulse_rules:
    - "Wave 2 must not retrace 100% of wave 1."
    - "Wave 3 must not be the shortest of waves 1, 3 and 5."
    - "Wave 4 must not overlap wave 1 price territory for a standard impulse."
  motive_patterns:
    - impulse
    - leading_diagonal
    - ending_diagonal
  corrective_patterns:
    - zigzag
    - flat
    - triangle
    - double_three
    - triple_three
  guidelines:
    - "Alternation: sharp wave 2 often contrasts with sideways wave 4, and vice versa."
    - "Fibonacci relationships can estimate retracement and extension zones, but only after a valid structural count."
    - "Wave 3 is often the strongest directional leg, but it is not required to be the longest."
    - "Ending diagonals can precede sharp reversals; their wave-4 overlap is not treated as an impulse-rule violation."
  trading_context:
    preferred:
      - "Trade with the higher-degree trend."
      - "Use wave 2/4/B-style corrections as setup zones rather than blindly chasing impulses."
      - "Prefer confirmed structure plus liquidity/order-flow confluence."
    avoid:
      - "Forcing wave labels after a single large candle."
      - "Treating an Elliott count as a signal by itself."
      - "Entering solely because a Fibonacci ratio matches."

sfp:
  definition: >
    A swing failure pattern is a liquidity sweep beyond a meaningful swing point
    followed by a close back inside the level.
  anatomy:
    - "Identify a meaningful prior swing high/low."
    - "Require price to trade beyond that swing."
    - "Require rejection and close back through the swept level."
    - "Prefer liquidity pools, daily/weekly levels, or obvious equal highs/lows."
  confirmations:
    - "Higher-timeframe structure"
    - "CVD/price divergence"
    - "OI and liquidation context"
    - "Order-book imbalance"
    - "Reaction quality at the swept level"
  invalidation:
    - "Acceptance beyond the swept level"
    - "No reclaim / no close back inside"
    - "Poor reward-to-risk after structural stop placement"

breakout:
  definition: "A breakout is a structural level breach with evidence of acceptance rather than a wick-only excursion."
  confirmation:
    - "Body close beyond a meaningful support/resistance or trendline."
    - "Displacement relative to recent candles."
    - "Order-flow confirmation where available."
    - "Retest/rejection of the broken level is higher quality than blind first-touch chasing."
  fakeout:
    - "Wick through level followed by close back inside."
    - "Immediate reclaim/failure of the breakout level."
    - "Breakout against dominant higher-timeframe structure without sufficient confirmation."
  no_trade:
    - "Mid-range breakout with no clean level."
    - "High spread / high volatility execution conditions."
    - "No structural invalidation point."

d_line:
  model: >
    Dev Trader's D-Line is treated as a validated trendline built from meaningful
    swing pivots and traded only when the line has earned enough touches.
  validation:
    - "At least two meaningful touches, with clean geometry."
    - "Prefer a third interaction/retest for stronger validation."
    - "Do not treat a line that was repeatedly violated as high-quality support/resistance."
  breakout:
    - "Wait for a body close through the line."
    - "Prefer alignment with the larger trend."
    - "Prefer retest/rejection of the broken line before entry."
    - "Use ATR-aware risk rather than microscopic stops."
  failure:
    - "Close back through the D-Line after the break."
    - "Break occurs directly into major opposing liquidity."
    - "Insufficient reward-to-risk."

market_structure:
  states:
    bullish: "Higher highs and higher lows; demand is controlling the swing sequence."
    bearish: "Lower highs and lower lows; supply is controlling the swing sequence."
    range: "Alternating or overlapping swings without directional acceptance."
  transitions:
    bos: "Break of a prior swing level with acceptance/close."
    mss: "Material change in swing behavior indicating a possible regime transition."
  rules:
    - "Structure outranks isolated indicator readings."
    - "A single wick is not treated as a confirmed structural break."
    - "Use higher timeframe structure to filter lower-timeframe signals."

confluence:
  priority:
    1: "Data quality / feed health"
    2: "Higher-timeframe market structure"
    3: "Liquidity location"
    4: "Price action trigger: SFP, breakout, D-Line, MSS"
    5: "Elliott-wave context"
    6: "CVD / OI / order-book confirmation"
    7: "Risk/reward and invalidation"
  no_trade_rules:
    - "Conflicting higher-timeframe structure"
    - "Unclear wave count"
    - "Range midline without an extreme or liquidity event"
    - "Breakout without acceptance"
    - "SFP without reclaim"
    - "R:R below the live minimum"
    - "Existing active trade not resolved"
    - "Quality governor daily cap or cooldown active"

execution:
  styles:
    scalp:
      timeframes: [5m, 15m]
      principle: "Fast reaction around liquidity or micro-structure with strict invalidation."
    swing:
      timeframes: [15m, 1h, 4h]
      principle: "Higher-timeframe alignment and wider structural targets."
  principle: >
    The engine should prefer WAIT over a marginal setup. A valid market
    opportunity is not automatically a valid trade.


reference_scenario_training:
  source: "Seven uploaded BTC/USDT TradingView reference images supplied for Dev Trader scenario training."
  purpose: >
    Convert the visual examples into reusable scenario templates. These are
    pattern-recognition and watch-state templates, not guaranteed forecasts
    and never bypass the elite quality governor.
  levels:
    hierarchy:
      - "2H order block = higher resistance/support anchor."
      - "15m order block = execution / reaction zone."
      - "1H order block = major reaction zone and possible corrective bounce."
      - "Daily order block = higher-timeframe target/confluence zone."
      - "Range POC / nPOC = confluence levels used to confirm or reject a projected target."
    rule: "Use dynamically detected zones; do not hardcode the exact prices from the reference screenshots."
  scenarios:
    local_abc_or_impulse:
      idea: "A local correction may be an ABC or the start/continuation of a five-wave impulse."
      watch_for:
        - "Rejection from a higher-timeframe 2H/15m resistance zone."
        - "Bearish MSS or lower-timeframe displacement."
        - "Sequential lower highs/lower lows after the first leg."
      invalidation:
        - "Strong acceptance back above the source resistance."
        - "Impulse rules fail or the wave count becomes ambiguous."
    bearish_five_wave_to_confluence:
      idea: "After a confirmed bearish reaction, watch for a five-wave decline toward a stacked 1H/daily/confluence zone."
      subwave_logic:
        - "Wave 1 = initial displacement."
        - "Wave 2 = countertrend bounce; do not chase it."
        - "Wave 3 = continuation with strongest momentum potential."
        - "Wave 4 = corrective bounce that should respect impulse structure."
        - "Wave 5 = final push into target/confluence, subject to confirmation."
      confirmation:
        - "Wave 2 remains below the origin/invalidation level."
        - "Wave 3 breaks the wave-1 extreme with acceptance."
        - "CVD/OI/order flow support the continuation."
      invalidation:
        - "Wave-2 retraces the entire wave-1 move."
        - "Structure accepts back above the source zone."
    one_hour_ob_bounce_then_continuation:
      idea: "A 1H order block can produce a temporary bounce that becomes a corrective Wave 2/B rather than a full reversal."
      watch_for:
        - "Price enters the 1H OB and rejects its lower boundary."
        - "5m/15m bullish MSS creates a reaction."
        - "Countertrend bounce retests a nearby 15m/2H resistance or prior support."
        - "Failure there can restart the higher-degree bearish sequence."
      no_trade:
        - "Buying the first touch without reclaim/structure confirmation."
        - "Treating the bounce as a full reversal while the higher-degree count remains bearish."
    flat_b_retest_then_c:
      idea: "A flat correction can produce a B-wave retest of the prior swing area before the C-wave continuation."
      watch_for:
        - "A-wave decline into a structural demand zone."
        - "B-wave retrace toward the prior support/resistance."
        - "B-wave rejection followed by C-wave displacement."
      invalidation:
        - "B-wave permanently accepts beyond the higher-degree invalidation level."
    harmonic_completion:
      idea: "A harmonic-like X-A-B-C-D completion can become relevant when Fibonacci ratios cluster at a structural zone."
      requirements:
        - "At least five meaningful alternating pivots."
        - "Ratio cluster is within tolerant pattern ranges."
        - "D point overlaps an order block, liquidity pool, FVG, POC/nPOC or Fibonacci confluence."
      confirmation:
        - "Reversal candle/MSS at D."
        - "CVD/order-flow divergence supports rejection."
      warning: "A harmonic ratio match without structural confirmation is only a WATCH state."
    range_rotation_between_zones:
      idea: "When price is trapped between a 15m/2H resistance zone and a 1H/daily support zone, expect rotation until acceptance resolves the range."
      long_condition: "Sweep/reclaim at the lower zone plus bullish structure confirmation."
      short_condition: "Sweep/rejection at the upper zone plus bearish structure confirmation."
      breakout_condition: "Body-close acceptance outside the range followed by a retest."
  target_ladder:
    principle: >
      Project targets as a ladder rather than a single magical price:
      nearest execution level -> 1H reaction zone -> daily reaction zone ->
      range POC/nPOC or Fibonacci extension if confluence exists.
    minimum_rule: "Never promote a projected target to a trade target until the entry/invalidation structure is confirmed."


video_reference_training:
  source_status: "Derived from the user-provided screenshots/captions of the linked BTC analysis video; full transcript was not retrievable in this environment."
  role: "Scenario-recognition knowledge only. Live confirmation and risk rules still control trades."
  lessons:
    - "A local decline can remain either an ABC correction or a five-wave impulse until structure resolves."
    - "A 1H order-block bounce can be a temporary Wave-2/B reaction rather than a full reversal."
    - "After a corrective bounce into higher resistance, a bearish impulse can develop through Waves 3-4-5."
    - "A Wave-C endpoint is more meaningful when it overlaps lower-timeframe support/OB plus higher-timeframe or Fibonacci confluence."
    - "A flat correction can use a B-wave retest before the C-wave continues."
    - "A harmonic X-A-B-C-D completion stays a watch condition until the D-zone confirms rejection or MSS."
    - "Range POC and order blocks are context levels; acceptance or rejection is required before directional entry."
    - "Map multiple scenarios first, define invalidation, then wait for price action to select the active branch."
  scenario_matrix:
    bearish_continuation: "Rejection from higher resistance -> possible Wave-2/B bounce into 1H/15m OB -> rejection/MSS -> continuation."
    five_wave_down: "Wave 1 displacement -> Wave 2 relief bounce -> Wave 3 continuation -> Wave 4 correction -> Wave 5 into confluence."
    confluence_bottom: "1H OB + daily OB + POC/nPOC + Fibonacci overlap becomes a watch zone; require sweep/rejection and bullish MSS/flow."
    bounce_then_dump: "Do not short the first 1H OB touch; allow the bounce, then evaluate the next rejection zone for B/Wave-2 completion."
  notification_policy:
    early_watch: "Notify when a scenario becomes ARMED around a clear trigger zone."
    setup_trigger: "Notify immediately when confirmation conditions are met."
    extended_move: "Do not chase a mature impulse; wait for the next corrective entry."
