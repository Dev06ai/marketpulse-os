<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050507">
<title>MarketPulse — Crypto Intelligence</title>
<style>
:root{--bg:#050507;--panel:#0b0b0e;--panel2:#111116;--line:rgba(255,255,255,.10);--text:#f5f5f7;--muted:#85858f;--cyan:#a7f3d0;--blue:#60a5fa;--violet:#c084fc;--pink:#f472b6;--green:#4ade80;--red:#f87171;--amber:#fbbf24;--shadow:0 18px 60px rgba(0,0,0,.42)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--text);font:13px Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:
radial-gradient(circle at 12% 0%,rgba(255,255,255,.035),transparent 24%),
radial-gradient(circle at 88% 0%,rgba(192,132,252,.035),transparent 20%),
linear-gradient(180deg,#030304 0,#08080a 48%,#020203 100%);min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:46px 46px;mask-image:linear-gradient(to bottom,#000,transparent 92%)}
button,input,select,textarea{font:inherit}.wrap{width:min(1440px,calc(100% - 26px));margin:0 auto;padding:18px 0 70px}
.header{position:sticky;top:0;z-index:20;background:rgba(4,4,6,.86);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.08)}
.headerInner{width:min(1440px,calc(100% - 26px));margin:auto;min-height:72px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;min-width:240px}.mark{font-size:0;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:#0b0b0f;border:1px solid rgba(255,255,255,.12);box-shadow:0 0 32px rgba(192,132,252,.16),inset 0 0 0 1px rgba(167,243,208,.05);color:#fff;font-weight:1000;position:relative;overflow:hidden}.mark:before{content:"";position:absolute;inset:7px;border-radius:9px;background:conic-gradient(from 210deg,#a7f3d0,#60a5fa,#c084fc,#f472b6,#a7f3d0);opacity:.9}.mark:after{content:"MP";position:relative;z-index:2;font-size:12px;letter-spacing:-.08em;font-weight:1000;color:#050507;background:#f5f5f7;border-radius:7px;padding:4px 5px}.brandK{font-size:8px;letter-spacing:.14em;color:#8b8b95;font-weight:900}.brandName{font-size:23px;color:#f7f7f8;text-shadow:0 0 18px rgba(255,255,255,.06);;font-weight:900;letter-spacing:-.045em;line-height:1.05}.brandSub{font-size:9px;color:#8796a9;margin-top:4px}
.nav{display:flex;gap:4px;flex:1;justify-content:center}.nav button{border:1px solid transparent;background:transparent;color:#8797ab;padding:9px 11px;border-radius:9px;cursor:pointer;font-size:10px;font-weight:800}.nav button:hover,.nav button.active{color:#fff;background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.11)}
.headerTools{display:flex;align-items:center;gap:6px}.mobileMenuBtn,.mobileMenu{display:none}.mobileMenuBtn{border:1px solid rgba(255,255,255,.10);background:#0d0d10;color:#f2f2f4;border-radius:9px;padding:8px 10px;cursor:pointer;font-size:18px;line-height:1}.mobileMenu{position:absolute;right:12px;top:64px;width:min(220px,calc(100vw - 24px));padding:8px;border:1px solid rgba(255,255,255,.11);border-radius:13px;background:#101014;box-shadow:0 20px 70px rgba(0,0,0,.45);backdrop-filter:blur(20px);z-index:40}.mobileMenu.open{display:grid;grid-template-columns:1fr 1fr;gap:5px}.mobileMenu button{border:1px solid rgba(255,255,255,.09);background:#151519;color:#c9c9d0;padding:9px;border-radius:8px;text-align:left;font-size:9px;font-weight:800;cursor:pointer}.mobileMenu button:hover{background:rgba(103,232,255,.06);color:#fff}.select,.btn{background:#0a0a0d;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 10px}.btn{cursor:pointer}.btn.primary{border-color:rgba(167,243,208,.20);background:linear-gradient(135deg,rgba(167,243,208,.06),rgba(192,132,252,.08))}.liveDot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}.dataState{display:flex;align-items:center;gap:6px;color:#88a0b9;font-size:9px;white-space:nowrap}
