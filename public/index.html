<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MarketPulse OS</title><style>
body{margin:0;background:#07111f;color:#eef5ff;font:14px system-ui;padding:24px}main{max-width:1200px;margin:auto}header{display:flex;justify-content:space-between;gap:12px;align-items:center}select,button,input{background:#0b1a2b;color:#fff;border:1px solid #23405d;border-radius:8px;padding:9px}section{background:#0d1b2c;border:1px solid #1c3650;border-radius:14px;padding:16px;margin-top:16px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat{border:1px solid #1c3650;padding:12px;border-radius:10px}.big{font-size:20px;font-weight:700}.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #1c3650;text-align:left}.muted{color:#8ea4bb}.why div{padding:8px;border-bottom:1px solid #1c3650}@media(max-width:850px){.grid,.stats{grid-template-columns:1fr 1fr}}
</style></head><body><main><header><div><div class="muted">Crypto market decision support</div><h1>MarketPulse OS</h1></div><div><select id="sym"></select><select id="int"><option>15m</option><option selected>1h</option><option>4h</option><option>1d</option></select><button onclick="load()">Refresh</button></div></header>
<section><div class="stats"><div class="stat"><span class="muted">Price</span><div class="big" id="price">—</div></div><div class="stat"><span class="muted">Regime</span><div class="big" id="regime">—</div></div><div class="stat"><span class="muted">Setup</span><div class="big" id="setup">—</div></div><div class="stat"><span class="muted">Confluence</span><div class="big" id="score">—</div></div><div class="stat"><span class="muted">RSI / ADX</span><div class="big" id="mom">—</div></div></div></section>
<div class="grid"><section><h2>Levels</h2><div id="levels">Loading…</div><h2>Why</h2><div class="why" id="why"></div></section><section><h2>Scanner</h2><table><thead><tr><th>Asset</th><th>Regime</th><th>Setup</th><th>Score</th></tr></thead><tbody id="scan"></tbody></table></section></div>
<section><h2>Risk Lab</h2><div><label>Account <input id="acct" type="number" value="5000"></label> <label>Risk % <input id="risk" type="number" value="1"></label> <label>Entry <input id="entry" type="number" value="100000"></label> <label>Stop <input id="stop" type="number" value="98000"></label></div><p id="riskout"></p></section>
<p class="muted">Educational analytics only. No automatic trading or performance guarantee.</p></main>
<script>
const $=x=>document.getElementById(x),fmt=x=>Number.isFinite(+x)?Number(x).toLocaleString(undefined,{maximumFractionDigits:2}):"—";
async function api(u){const r=await fetch(u),j=await r.json();if(!r.ok)throw Error(j.error||"Request failed");return j}
async function load(){try{const d=await api('/api/market?symbol='+encodeURIComponent($('sym').value)+'&interval='+$('int').value),a=d.analysis;$('price').textContent=fmt(a.price);$('regime').textContent=a.regime;$('setup').textContent=a.type;$('score').textContent=a.score+'/100';$('mom').textContent=fmt(a.rsi)+' / '+fmt(a.adx);$('levels').innerHTML='<p><b>Entry:</b> '+(a.entryLow?fmt(a.entryLow)+' → '+fmt(a.entryHigh):'No setup')+'</p><p><b>Invalidation:</b> '+fmt(a.stop)+'</p><p><b>Target 1:</b> '+fmt(a.tp1)+'</p><p><b>Target 2:</b> '+fmt(a.tp2)+'</p>';$('why').innerHTML=a.reasons.map(x=>'<div>'+x+'</div>').join('');scan()}catch(e){$('why').innerHTML='<div>'+e.message+'</div>'}}
async function scan(){const d=await api('/api/scanner?interval='+$('int').value);$('scan').innerHTML=d.rows.map(r=>'<tr><td><b>'+r.label+'</b></td><td>'+r.regime+'</td><td>'+r.type+'</td><td>'+r.score+'</td></tr>').join('')}
function risk(){const a=+$('acct').value,p=(+$('risk').value)/100,e=+$('entry').value,s=+$('stop').value,b=a*p,dist=Math.abs(e-s);$('riskout').innerHTML='<b>Risk budget:</b> '+fmt(b)+' &nbsp; <b>Stop distance:</b> '+fmt(dist)+' &nbsp; <b>Position size:</b> '+fmt(dist?b/dist:0)}
(async()=>{const c=await api('/api/config');$('sym').innerHTML=c.symbols.map(s=>'<option>'+s+'</option>').join('');$('sym').onchange=load;$('int').onchange=load;['acct','risk','entry','stop'].forEach(x=>$(x).oninput=risk);risk();load()})()
</script></body></html>
